<title>ShelfSense Morning Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Hind:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F3F5F2; --paper:#FFFFFF; --ink:#18231F; --muted:#5E6B66; --line:#DCE2DE;
  --teal:#0E5A55; --teal-soft:#E1EEEC; --marigold:#E5A40B; --marigold-soft:#FBF0D3;
  --out:#B42318; --out-soft:#FBE4E1; --low:#A15C00; --low-soft:#FCEBD2; --ok:#2F6B3A; --ok-soft:#E0EFE2;
  --wa:#1C7C54; --on-accent:#FFFFFF;
  --display:"Baloo 2", "Hind", system-ui, sans-serif;
  --body:"Hind", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#101614; --paper:#18201D; --ink:#E6ECE9; --muted:#9AA8A2; --line:#2A3531;
    --teal:#6CC4BB; --teal-soft:#16302D; --marigold:#F2BC3F; --marigold-soft:#33290F;
    --out:#F28B80; --out-soft:#3A1D1A; --low:#F0B25C; --low-soft:#35270F; --ok:#8BCB96; --ok-soft:#18301D;
    --wa:#2FA56E; --on-accent:#0B1210;
  }
}
:root[data-theme="dark"]{
  --ground:#101614; --paper:#18201D; --ink:#E6ECE9; --muted:#9AA8A2; --line:#2A3531;
  --teal:#6CC4BB; --teal-soft:#16302D; --marigold:#F2BC3F; --marigold-soft:#33290F;
  --out:#F28B80; --out-soft:#3A1D1A; --low:#F0B25C; --low-soft:#35270F; --ok:#8BCB96; --ok-soft:#18301D;
  --wa:#2FA56E; --on-accent:#0B1210;
}
*{box-sizing:border-box}
html{font-size:calc(100% * var(--text-scale, 1))}
body{background:var(--ground);color:var(--ink);font:400 1rem/1.45 var(--body);}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--marigold);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);
  padding-block:12px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font:700 1.45rem/1 var(--display);margin:0;color:var(--teal)}
.brand .right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.brand .date{font-size:.88rem;color:var(--muted)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:var(--paper);padding:3px 10px;font-size:.82rem;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--teal);color:var(--on-accent)}
nav.tabs{display:flex;gap:2px;margin-top:10px;overflow-x:auto}
nav.tabs button{flex:1 0 auto;border:0;background:none;padding:9px 10px 10px;cursor:pointer;
  font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--teal);border-bottom-color:var(--teal)}
nav.tabs .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;
  background:var(--out);color:var(--on-accent);font-size:.72rem;line-height:18px;text-align:center}

h2.sec{font:700 1.25rem/1.2 var(--display);margin:18px 0 4px}
p.lead{margin:0 0 10px;color:var(--muted);font-size:.92rem;max-width:62ch}
.totals{display:flex;gap:18px;margin-top:14px;flex-wrap:wrap}
.totals div{display:flex;flex-direction:column}
.totals b{font:700 1.35rem/1.1 var(--display)}
.totals span{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;gap:8px;margin-top:12px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:.88rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--on-accent)}

.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;margin-top:14px;overflow:hidden}
.card-head{padding:14px 16px 10px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline}
.card-head h3{font:700 1.15rem/1.15 var(--display);margin:0}
.card-head .sum{font:700 1.15rem var(--display);text-align:right}
.card-body{padding:0 16px 14px}
.terms{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:.75rem;padding:2px 8px;border-radius:6px;background:var(--teal-soft);color:var(--teal);font-weight:500}
.pill{font-size:.72rem;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.pill.out{background:var(--out-soft);color:var(--out)}
.pill.low{background:var(--low-soft);color:var(--low)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.info{background:var(--teal-soft);color:var(--teal)}
.pill.warn{background:var(--low-soft);color:var(--low)}
.pill.tapable{border:0;cursor:pointer;font-family:inherit}
.lockpill{display:inline-block;margin-left:6px;font-size:.62rem;font-weight:700;letter-spacing:.04em;padding:1px 6px;border-radius:999px;background:var(--low-soft);color:var(--low);vertical-align:1px}
.plan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 6px}
.plan-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 6px 12px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;font-family:inherit;text-align:center}
.plan-card:hover,.plan-card:focus-visible{border-color:var(--teal)}
.plan-card.best{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.plan-card strong{font-size:.82rem}
.plan-card .price{font:700 1.3rem var(--display);color:var(--teal)}
.plan-card .price.big{font-size:2.1rem}
.plan-card small{font-size:.68rem;color:var(--muted);line-height:1.25}
.plan-card .save{margin-top:4px;font-size:.66rem;font-weight:700;color:var(--ok);background:var(--ok-soft);padding:1px 7px;border-radius:999px}
.plan-card .ribbon{position:absolute;top:-9px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:.6rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--teal);color:#fff}
.lockbox{margin:14px 0 4px;padding:12px 14px;border-radius:14px;background:var(--low-soft);border:1px solid var(--low)}
.lockbox strong{display:block;color:var(--low);font-size:.9rem}
.lockbox p{margin:4px 0 0;font-size:.84rem}
.lede{font-size:.9rem;margin:14px 0 8px}
.paybox{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:28px;padding:26px 18px;border:1.5px solid var(--line);border-radius:18px;background:var(--card);text-align:center}
.paybox .price{font:700 2.1rem var(--display);color:var(--teal)}
.btn.wide{width:100%;justify-content:center;margin-top:6px}
@media (max-width:360px){.plan-grid{grid-template-columns:1fr;}}

ul.items{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li.item{border-bottom:1px solid var(--line)}
li.item.off .main{opacity:.45}
li.item.off .name{text-decoration:line-through}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 16px}
.row input[type=checkbox]{width:22px;height:22px;accent-color:var(--teal)}
.main{min-width:0}
.name{font-weight:600;line-height:1.25}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:3px;font-size:.82rem;color:var(--muted)}
.qty{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.step button{width:34px;height:34px;border:0;background:var(--ground);font-size:1.1rem;font-weight:600;cursor:pointer}
.step button:disabled{opacity:.35;cursor:default}
.step output{min-width:34px;text-align:center;font-weight:600}
.cost{font-size:.85rem;color:var(--muted)}
details.why{padding:0 16px 10px 48px;font-size:.86rem;color:var(--muted)}
details.why summary{cursor:pointer;color:var(--teal);font-weight:500;width:max-content}
.why p{margin:6px 0 4px}
.why p:first-of-type::first-letter{text-transform:uppercase}
.alt{display:flex;justify-content:space-between;gap:12px;border-top:1px dashed var(--line);padding-top:4px;margin-top:4px}

.send{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;background:var(--marigold-soft)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1 1 150px;display:inline-flex;justify-content:center;align-items:center;gap:8px;border-radius:10px;
  padding:10px 14px;font-weight:600;cursor:pointer;text-decoration:none;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);text-align:center}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--on-accent)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.small{flex:0 0 auto;padding:6px 12px;font-size:.88rem}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.linkish{border:0;background:none;color:var(--teal);font-weight:600;cursor:pointer;padding:0;text-decoration:underline}
details.preview summary{cursor:pointer;font-size:.85rem;color:var(--muted)}
pre.msg{white-space:pre-wrap;font:400 .85rem/1.45 var(--body);background:var(--paper);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;margin:8px 0 0;max-height:260px;overflow:auto}
.note{font-size:.84rem;color:var(--muted)}
.okline{font-size:.84rem;color:var(--ok);font-weight:600}

.issues{list-style:none;margin:10px 0;padding:0;display:grid;gap:6px}
.issues li{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;padding:8px 10px;border-radius:10px;font-size:.9rem}
.issues li.bad{background:var(--out-soft)}
.issues li.warn{background:var(--low-soft)}
.issues li.good{background:var(--ok-soft)}
.issues b{font-weight:600}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:640px}
td input.date{width:130px;text-align:left}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--ground)}
td.r,th.r{text-align:right}
td select{max-width:210px;width:100%;padding:4px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
td input{width:64px;padding:4px;border:1px solid var(--line);border-radius:6px;background:var(--paper);text-align:right}
tr.unmatched td{background:var(--low-soft)}
.billtext{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem}
.thinking{display:flex;gap:10px;align-items:center;padding:12px 0;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--teal)}
@media (prefers-reduced-motion:no-preference){.dot{animation:pulse 1s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.25}}

.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);margin-top:12px}
.stockrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--line)}
.stockrow .big{font:700 1.3rem/1 var(--display);text-align:right}
.stockrow .edit{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:4px}
.stockrow input{width:70px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--paper);text-align:right}
.lots{grid-column:1/-1;background:var(--ground);border-radius:10px;padding:10px 12px}
.lotrow{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:6px 0;border-top:1px dashed var(--line);font-size:.88rem}
.lotrow:first-of-type{border-top:0}
input.date{padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
.rmform{display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%;padding:8px 10px;border-radius:10px;background:var(--out-soft);font-size:.88rem}
.rmform input,.rmform select{padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--paper);width:auto;max-width:9em}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:12px;padding:10px 14px;border-radius:12px;background:var(--out-soft);color:var(--ink);font-size:.92rem}
.ean{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.75rem;color:var(--muted)}

.scanbox{display:flex;gap:8px;margin-top:10px}
.scanbox input{flex:1;min-width:0;padding:12px;border:2px solid var(--teal);border-radius:10px;background:var(--paper);
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.05rem}
.cart{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--line)}
.cart li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.source{display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:12px;background:var(--teal-soft);margin-top:12px}
.source b{font-weight:600}
ol.steps{margin:6px 0 0;padding-left:20px;font-size:.9rem}
ol.steps li{margin:4px 0}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem;background:var(--ground);padding:1px 5px;border-radius:5px;word-break:break-all}

footer.proof{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted)}
footer.proof h3{font:700 1rem var(--display);color:var(--ink);margin:0 0 8px}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:132px 1fr 52px;gap:10px;align-items:center}
.bar .track{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar .fill{height:100%;background:var(--muted)}
.bar.me .fill{background:var(--teal)}
.bar.me span{color:var(--ink);font-weight:600}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink);display:inline-grid;place-items:center;cursor:pointer;flex:none;font-size:1rem}
.iconbtn svg{width:20px;height:20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--muted)}
.center{text-align:center}
.err{color:var(--out);font-size:.88rem;min-height:1.2em;margin:0}
.btn.danger{color:var(--out);border-color:var(--out);background:var(--paper)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--teal-soft);color:var(--teal);display:inline-grid;place-items:center;font:700 1.15rem var(--display);flex:none}
.avatar.big{width:56px;height:56px;font-size:1.5rem}
.avatar.sm{width:28px;height:28px;font-size:.9rem}
.text{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit}
.text:focus{outline:3px solid var(--marigold);outline-offset:1px}

/* login */
.authwrap{min-height:100vh;background:var(--ground);padding-inline:16px;padding-block:0 32px}
.auth-top{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding-block:12px}
.auth-top .lang button{padding:5px 12px}
.auth-card{max-width:420px;margin:2vh auto 0}
.brandmark{display:flex;gap:14px;align-items:center;margin-bottom:22px}
.logo{width:68px;height:68px;border-radius:20px;background:var(--teal);color:var(--on-accent);display:grid;place-items:center;flex:none}
.logo svg{width:48px;height:48px}
.brandmark h1{font:700 2.1rem/1 var(--display);color:var(--teal);margin:0}
.tagline{color:var(--muted);margin:6px 0 0;font-size:.95rem;text-wrap:balance}
.auth-body{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px 18px}
.auth-body h2{font:700 1.3rem/1.2 var(--display);margin:0 0 12px;text-wrap:balance}
.auth-body h3{font:700 1.02rem var(--display);margin:0}
.stack{display:flex;flex-direction:column;gap:10px}
.stack > .btn{flex:0 0 auto;margin-top:4px}
.field{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted)}
.phone{display:flex;align-items:stretch}
.phone .cc{display:flex;align-items:center;padding:0 10px;border:1px solid var(--line);border-right:0;border-radius:10px 0 0 10px;background:var(--ground);color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.phone .text{border-radius:0 10px 10px 0;min-width:0;flex:1;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.inlineform .phone{flex:1 1 11em}
.inlineform .phone .text{max-width:none}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.8rem;margin:14px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.or + .btn{width:100%}
.users{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.userbtn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px;border-radius:14px;border:1px solid var(--line);background:var(--ground);color:var(--ink);cursor:pointer;font:600 .95rem var(--body)}
.userbtn small{color:var(--muted);font-weight:400}
.row-btn{flex-direction:row;justify-content:flex-start;text-align:left;width:100%}
.row-btn .grow{display:flex;flex-direction:column;flex:1}
.who{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.who h2{margin:4px 0 0}
.pindots{display:flex;gap:14px;justify-content:center;margin:18px 0 16px}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--teal)}
.pindots i.on{background:var(--teal)}
@media (prefers-reduced-motion:no-preference){.pindots.shake{animation:shake .3s}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:290px;margin:0 auto}
.pinpad button{height:58px;border-radius:14px;border:1px solid var(--line);background:var(--ground);color:var(--ink);font:600 1.45rem var(--body);cursor:pointer;font-variant-numeric:tabular-nums}
.pinpad button:active{background:var(--teal-soft)}
.pinpad button[data-k="ok"]{background:var(--teal);color:var(--on-accent);border-color:var(--teal)}
.linkrow{display:flex;justify-content:space-between;gap:12px;margin-top:10px;flex-wrap:wrap}
.card-form{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.auth-foot{max-width:420px;margin:16px auto 0;color:var(--muted);font-size:.8rem;text-align:center;text-wrap:balance}

/* settings */
.sheet{position:fixed;inset:0;z-index:20;background:var(--ground);overflow-y:auto;overscroll-behavior:contain;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{position:sticky;top:0;z-index:1;background:var(--ground);display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.sheet-head h2{font:700 1.35rem var(--display);margin:0;color:var(--teal)}
.sheet-body{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:4px 48px}
.set-group{margin-top:18px}
.set-group h3{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 6px 4px;font-weight:600}
.set-card{background:var(--paper);border:1px solid var(--line);border-radius:14px}
.set-card.profile{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px}
.profile .grow{display:flex;flex-direction:column;flex:1;min-width:140px}
.profile small{color:var(--muted)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;padding:11px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.set-row:first-child{border-top:0}
.set-row .lbl{display:flex;flex-direction:column;min-width:0}
.set-row .lbl small{color:var(--muted);font-size:.8rem}
.inline{display:inline-flex;align-items:center;gap:8px}
.full{flex-basis:100%}
.inlineform{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.inlineform .text{width:auto;max-width:12em;padding:7px 10px}
.inlineform.wide{flex-basis:100%}
.inlineform.wide .text{flex:1 1 9em;max-width:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--paper);color:var(--ink);padding:6px 11px;cursor:pointer;font-size:.86rem}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--teal);color:var(--on-accent)}
.switch{width:46px;height:28px;border-radius:14px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch[aria-checked="true"]{background:var(--teal)}
.switch[aria-checked="true"]::after{left:21px}
@media (prefers-reduced-motion:no-preference){.switch::after{transition:left .15s}}
code.code{font-size:1.05rem;letter-spacing:.12em;padding:4px 10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--ground);padding:9px 16px;border-radius:999px;font-size:.9rem;z-index:30;max-width:90vw;text-align:center}
.cam{position:fixed;inset:0;z-index:60;background:#0b0f0e;color:#fff;display:flex;flex-direction:column;padding:12px 16px calc(16px + env(safe-area-inset-bottom))}
.cam-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.cam-head .iconbtn{color:#fff;background:transparent;border-color:#fff6}
.cam-view{position:relative;flex:1;min-height:0;border-radius:14px;overflow:hidden;background:#000}
.cam-view video{width:100%;height:100%;object-fit:cover;display:block}
.cam-aim{position:absolute;left:10%;right:10%;top:35%;bottom:35%;border:3px solid var(--marigold);border-radius:12px;box-shadow:0 0 0 999px #0006}
.cam-status{margin:10px 0 4px;font-weight:600;min-height:1.4em}
.cam-log{list-style:none;margin:0;padding:0;font-size:.9rem;opacity:.85}
.cam-log li{padding:2px 0}
.cam-foot{margin-top:10px}
.cam-btn{display:inline-flex;align-items:center;gap:6px}
.sel{flex:1;min-width:0;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit}
.cnt-list li{flex-wrap:wrap;align-items:center}
.cnt-list .grow{flex:1 1 100%;display:flex;flex-direction:column}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper input{width:4.2em;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit;text-align:center}
.stepper .btn.small{padding:4px 10px;min-width:34px}
.expin{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);margin-left:auto}
.cnt-list .stepper{margin-top:4px}
.cnt-list .expin{margin-top:4px}
.cnt-list .date{max-width:9.5em}
.cnt-mode{margin:12px 0 4px}
.count-card{border-color:var(--teal)}
.alts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.alts .chip{font-size:.8rem}
.dot.live{display:inline-block;width:9px;height:9px;border-radius:50%;background:currentColor;animation:pulse 1.2s infinite}
@media (prefers-reduced-motion: reduce){.dot.live{animation:none}}
#pay-amt{font-family:inherit}
.small-code{font-size:.72rem;word-break:break-all}
.picks{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.pick{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit;cursor:pointer}
.pick span:first-child{display:flex;flex-direction:column;min-width:0}
.pick strong{font-weight:600;overflow-wrap:anywhere}
.pick small{color:var(--muted);font-size:.78rem}
.pick .add{flex:none;font-weight:700;color:var(--teal)}
.pick.off{border-style:dashed}
.pick.new{background:transparent}
.pick-form{margin-top:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.pick-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.credit{font-size:.72rem}
.unknown-box .grow{flex:1;min-width:0}
.picks.full{flex-basis:100%;margin-top:8px}
.set-card .picks .pick{background:var(--ground)}
.inlineform.wide .phone{flex:1 1 11em}
.set-card .stack.full{flex-basis:100%;gap:8px}
.checkline{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;margin:8px 0}
.empty{padding:14px 16px;color:var(--muted);font-size:.9rem}

/* ------------------------------------------------------------------ dates & batches */
const dayMs = 864e5;
const addDays = (iso, n) => new Date(Date.parse(iso + "T00:00:00Z") + Math.round(n) * dayMs).toISOString().slice(0, 10);
const daysBetween = (a, b) => Math.round((Date.parse(b + "T00:00:00Z") - Date.parse(a + "T00:00:00Z")) / dayMs);
const shelf = sku => DATA.shelf_days[sku] || 365;
const clone = x => x == null ? x : JSON.parse(JSON.stringify(x));

function seedStock() {
  return {count_date: DATA.stock.count_date, counts: {...DATA.stock.counts}, lots: clone(DATA.stock.lots) || {},
          notes: {}, applied: [], updated_at: null};
}
function lotsOf(st, sku) {
  st.lots ||= {}; st.counts ||= {};
  if (!st.lots[sku]) {
    const q = st.counts[sku] || 0;
    st.lots[sku] = q > 0 ? [{lid: "c-" + sku, qty: q, exp: addDays(st.count_date, Math.max(1, Math.floor(shelf(sku) / 2))), est: true}] : [];
  }
  return st.lots[sku];
}
function recount(st, sku) {
  st.counts[sku] = Math.round(st.lots[sku].reduce((a, l) => a + l.qty, 0) * 10) / 10;
}
function takeFEFO(st, sku, q) {           // sell / remove: earliest expiry first
  const lots = lotsOf(st, sku).sort((a, b) => a.exp < b.exp ? -1 : a.exp > b.exp ? 1 : 0);
  let left = q;
  for (const l of lots) { if (left <= 0) break; const t = Math.min(l.qty, left); l.qty -= t; left -= t; }
  st.lots[sku] = lots.filter(l => l.qty > 1e-9);
  recount(st, sku);
}
function addLot(st, sku, qty, exp, est, lid) {
  if (qty <= 0) return;
  lotsOf(st, sku).push({lid, qty, exp, est: !!est});
  recount(st, sku);
}

/* ------------------------------------------------------------------ changes (ops)
   Every change the shopkeeper makes is an "op" with a unique id. It is applied to the
   screen at once, kept in an outbox on this phone, and sent to the shared store when
   online. Applying an op twice has no effect, so retries after a dropped connection
   never double-count. */
const DEVICE = lsGet("shelfsense-device", null) || (() => { const d = "d" + Math.random().toString(36).slice(2, 10); lsSet("shelfsense-device", d); return d; })();
const newId = () => `${DEVICE}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`;
let OUTBOX_KEY = "shelfsense-outbox-v1", BASE_KEY = "shelfsense-base-v1";
const STOCK_KINDS = new Set(["setup_stock", "receive", "sell", "csv_sales", "recount", "count", "remove", "set_expiry"]);
const emptyBase = () => ({stock: null, deliveries: {}, orders: {}, scans: {}, barcodes: {}, writeoffs: {}, payments: {},
                          products: {}, suppliers: {}, pricelists: {}, shop_details: null});
let outbox = [];
let base = emptyBase();
function bindShop(id) {          // each shop keeps its own copy and queue on this phone
  OUTBOX_KEY = "shelfsense-outbox-v1:" + id;
  BASE_KEY = "shelfsense-base-v1:" + id;
  for (const [oldKey, newKey] of [["shelfsense-outbox-v1", OUTBOX_KEY], ["shelfsense-base-v1", BASE_KEY]]) {
    const old = lsGet(oldKey, null);            // data saved before accounts existed = the example data
    if (old == null) continue;
    if (id === "example" && lsGet(newKey, null) == null) lsSet(newKey, old);
    try { localStorage.removeItem(oldKey); } catch (e) {}
  }
  outbox = lsGet(OUTBOX_KEY, []);
  base = lsGet(BASE_KEY, null) || emptyBase();
}
const saveOutbox = () => lsSet(OUTBOX_KEY, outbox);
const saveBase = () => lsSet(BASE_KEY, base);

function applyStock(st, op) {
  const note = (sku, n) => { st.notes ||= {}; st.notes[sku] = {...n, at: op.at.slice(0, 10)}; };
  switch (op.kind) {
    case "receive":
      for (const [sku, q] of Object.entries(op.rec.received)) {
        const exp = op.expiry?.[sku];
        addLot(st, sku, q, exp || addDays(op.rec.bill_date, shelf(sku)), !op.expiry_known?.[sku], `${op.id}-${sku}`);
        note(sku, {k: "recv_note", n: q, s: op.rec.supplier});
      }
      break;
    case "sell":
      for (const [sku, q] of Object.entries(op.units)) { takeFEFO(st, sku, q); note(sku, {k: "sold_note", n: q}); }
      break;
    case "csv_sales":
      for (const [day, units] of Object.entries(op.days))
        if (op.all || day >= st.count_date) for (const [sku, q] of Object.entries(units)) { takeFEFO(st, sku, q); note(sku, {k: "sold_note", n: q}); }
      break;
    case "recount": {
      const now = (lotsOf(st, op.sku), st.counts[op.sku] || 0);
      if (op.n < now) takeFEFO(st, op.sku, now - op.n);
      else addLot(st, op.sku, op.n - now, addDays(op.at.slice(0, 10), Math.max(1, Math.floor(shelf(op.sku) / 2))), true, op.id);
      note(op.sku, {k: "recount_note"});
      break;
    }
    case "count": {                      // a shelf count: set (or add to) several products at once
      const day = op.at.slice(0, 10);
      for (const [sku, n] of Object.entries(op.counts)) {
        const now = (lotsOf(st, sku), st.counts[sku] || 0);
        const exp = op.exp?.[sku];
        const add = op.mode === "add" ? n : n - now;
        if (add < 0) takeFEFO(st, sku, -add);
        else if (add > 0) addLot(st, sku, add, exp || addDays(day, Math.max(1, Math.floor(shelf(sku) / 2))), !exp, `${op.id}-${sku}`);
        else st.counts[sku] = now;             // counted, even if zero
        if (exp && op.mode !== "add") for (const l of st.lots[sku]) { l.exp = exp; l.est = false; }
        note(sku, {k: op.mode === "add" ? "added_note" : "counted_note", n});
      }
      if (op.mode !== "add") st.count_date = day > st.count_date ? day : st.count_date;
      break;
    }
    case "remove": {
      const lots = lotsOf(st, op.sku);
      const lot = lots.find(l => l.lid === op.lid);
      if (lot) { const t = Math.min(lot.qty, op.qty); lot.qty -= t; st.lots[op.sku] = lots.filter(l => l.qty > 1e-9); recount(st, op.sku); }
      else takeFEFO(st, op.sku, op.qty);
      note(op.sku, {k: "removed_note", n: op.qty, r: op.reason});
      break;
    }
    case "set_expiry": {
      const lot = lotsOf(st, op.sku).find(l => l.lid === op.lid);
      if (lot) { lot.exp = op.exp; lot.est = false; }

}
function mergeScans(doc, op, day, units) {
  const d = doc && doc.units ? clone(doc) : {day, units: {}, bills: 0, ops: []};
  if (d.ops.includes(op.id)) return null;           // already counted
  for (const [k, v] of Object.entries(units)) d.units[k] = (d.units[k] || 0) + v;
  d.bills += op.bills || 0;

}

          value: Math.round(op.qty * (DATA.cost[op.sku] || 0) * 100) / 100};
}
function applyOp(state, op) {
  if (STOCK_KINDS.has(op.kind)) {
    if (op.kind === "setup_stock") { if (!state.stock) state.stock = clone(op.stock); }
    else {
      if (!state.stock) state.stock = seedStock();
      const st = state.stock;
      st.applied ||= [];

    }

  if (op.kind === "order_sent") state.orders[op.key] = op.rec;
  if (op.kind === "payment") state.payments = {...state.payments, [op.rec.id]: op.rec};
  if (op.kind === "add_product") state.products = {...(state.products || {}), [op.product.sku_id]: op.product};
  if (op.kind === "supplier") state.suppliers = {...(state.suppliers || {}), [op.sup.id]: op.sup};
  if (op.kind === "price_list") state.pricelists = {...(state.pricelists || {}), [op.supplier_id]: {rates: op.rates, at: op.at}};
  if (op.kind === "shop_details") state.shop_details = {...(state.shop_details || {}), ...op.details};
  if (op.kind === "subscribe") state.sub = op.sub;
  if (op.kind === "order_confirm" && state.orders[op.key])
    state.orders[op.key] = {...state.orders[op.key], status: "confirmed", confirmed_at: op.at, confirmed_by: op.by || null};
  if (op.kind === "link_barcode") state.barcodes = {...state.barcodes, [op.code]: op.sku};
  if (op.kind === "sell") { const d = mergeScans(state.scans[op.day], op, op.day, op.units); if (d) state.scans[op.day] = d; }
  if (op.kind === "csv_sales") for (const [day, units] of Object.entries(op.days)) {
    const d = mergeScans(state.scans[day], op, day, units); if (d) state.scans[day] = d;
  }
  if (op.kind === "remove") {

    if (!w.entries.some(e => e.id === op.id)) state.writeoffs[m] = {entries: [...w.entries, writeoffEntry(op)]};

}
function rebuild() {
  const view = clone(base);
  view.payments ||= {}; view.products ||= {}; view.suppliers ||= {}; view.pricelists ||= {};
  for (const op of outbox) applyOp(view, op);
  useProducts(view.products);
  useSuppliers(view.suppliers);
  Object.assign(S, view);
  render();
}
function commit(kind, fields) {
  if (!S.canWrite) { toast(t("readonly")); return null; }
  const op = {id: newId(), at: new Date().toISOString(), kind, by: Auth.user?.name || null, ...fields};
  outbox.push(op); saveOutbox();
  rebuild();
  if (Sync.db && !navigator.onLine) toast(t("saved_offline"));
  Sync.kick();
  return op;
}

/* --------------------------------------------------------------- the plan
 * Every shop starts on a 30-day trial with everything unlocked. After that the
 * shop keeps the daily loop — counting, billing, expiry, the order list — and the
 * time-saving extras become part of Plus (₹99/month).
 * Payment here is SIMULATED: no money moves. Swap checkout() for a real
 * Razorpay order when you have a merchant account (see DEPLOY.md).
 */
const TRIAL_DAYS = 30;
const PLANS = {
  m: {key: "m", months: 1, price: 99,  save: 0},
  q: {key: "q", months: 3, price: 249, save: 16},
  y: {key: "y", months: 12, price: 899, save: 24},
};
const PRO = {
  bill: {name: "fx_bill", p: "fx_bill_p"},

  wh:   {name: "fx_wh",   p: "fx_wh_p"},
  pl:   {name: "fx_pl",   p: "fx_pl_p"},
  team: {name: "fx_team", p: "fx_team_p"},
  hist: {name: "fx_hist", p: "fx_hist_p"},

const FREE_LIST = ["ff_count", "ff_sell", "ff_order", "ff_exp", "ff_sup", "ff_off"];
const DAY_MS = 86400000;
const addMonths = (iso, n) => { const d = new Date(iso); d.setMonth(d.getMonth() + n); return d.toISOString(); };
const showDate = iso => new Date(iso).toLocaleDateString(lang === "hi" ? "hi-IN" : "en-IN",
                                                         {day: "numeric", month: "short", year: "numeric"});
function trialStart() {                     // when this shop first opened the app
  const known = S.sub?.trial_from || S.shop_details?.at;   // never sub.started: a lapsed
  if (known) return known;                                 // plan must not hand out a new trial
  const k = "ss_first_seen_" + (Auth.shop?.id || "x");
  let v = null;

  catch (e) { v = new Date().toISOString(); }

function plan() {
  if (Auth.isExample()) return {tier: "plus", until: addMonths(new Date().toISOString(), 12), cycle: "y", demo: true};
  const sub = S.sub;
  const now = Date.now();
  if (sub?.plan === "plus" && Date.parse(sub.until) > now)
    return {tier: "plus", until: sub.until, cycle: sub.cycle};
  const ends = Date.parse(trialStart()) + TRIAL_DAYS * DAY_MS;

function planCard(k) {

  box.innerHTML = `

async function checkout(key) {
  const p = PLANS[key];
  ST.pay = {key, step: "busy"};
  drawPlans();
  await new Promise(r => setTimeout(r, 1400));            // a real gateway would go here
  const now = new Date().toISOString();
  const cur = plan();
  const from = cur.tier === "plus" ? cur.until : now;      // renewing adds to what is left
  const until = addMonths(from, p.months);
  commit("subscribe", {sub: {plan: "plus", cycle: key, started: now, until, trial_from: trialStart(),
                             amount: p.price, ref: "DEMO-" + newId().slice(0, 8).toUpperCase()}});
  ST.pay = {key, step: "done", until};
  drawPlans();
  if (!$("#settings").hidden) drawSettings();      // drop the lock badges behind the sheet
}

/* ------------------------------------------------------------------ sync */
function scopedDb(raw, shopId) {    // one shared store, one folder per shop
  const pre = "shops/" + shopId + "/";
  return {doc: p => raw.doc(pre + p), collection: p => raw.collection(pre + p)};
}
const Sync = {
  db: null, busy: false, timer: null, backoff: 2000, hadTrouble: false,
  set(state) {
    S.sync = state;
    if (state === "offline" || state === "retry") this.hadTrouble = true;
    if (state === "synced" && this.hadTrouble) { this.hadTrouble = false; toast(t("synced_all")); }
    drawSync();
  },
  async start() {
    rebuild();
    const raw = window.claude?.use ? await window.claude.use("db") : null;
    const db = raw && !Cloud ? scopedDb(raw, Auth.shop.id) : raw;   // the cloud adapter scopes by shop itself
    this.started = true;
    if (!db) { if (!base.stock) base.stock = seedStock(); S.loading = false; this.flushLocal(); return; }
    this.db = db; S.store = "db";
    const put = (key, value) => { base[key] = value; saveBase(); rebuild(); };
    const fail = e => { if (e?.code === "revoked") { S.canWrite = false; render(); } };
    db.doc("shop/stock").onSnapshot(s => {
      const d = s.exists ? s.data() : null;
      S.loading = false;
      put("stock", d && d.counts ? d : null);
      // a brand-new shop: start from the shelf count once (safe: only applies if nothing is saved yet)
      if (!(d && d.counts) && !this.autoSetup && S.canWrite && !outbox.some(o => o.kind === "setup_stock")) {
        this.autoSetup = true;
        commit("setup_stock", {stock: seedStock()});
      }
    }, fail);
    db.collection("deliveries").onSnapshot(q => put("deliveries", Object.fromEntries(q.docs.map(d => [d.id, d.data()]))), fail);
    db.collection("orders").onSnapshot(q => put("orders", Object.fromEntries(q.docs.map(d => [d.id, d.data()]))), fail);
    db.collection("scans").onSnapshot(q => put("scans", Object.fromEntries(q.docs.filter(d => d.data().units).map(d => [d.id, d.data()]))), fail);
    db.collection("writeoffs").onSnapshot(q => put("writeoffs", Object.fromEntries(q.docs.filter(d => d.data().entries).map(d => [d.id, d.data()]))), fail);
    db.collection("payments").onSnapshot(q => put("payments", Object.fromEntries(q.docs.filter(d => d.data().amount).map(d => [d.id, d.data()]))), fail);
    db.doc("settings/suppliers").onSnapshot(s => put("suppliers", (s.exists && s.data().items) || {}), fail);
    db.doc("settings/pricelists").onSnapshot(s => put("pricelists", (s.exists && s.data().items) || {}), fail);
    db.doc("settings/shop").onSnapshot(s => put("shop_details", s.exists ? s.data() : null), fail);
    db.doc("settings/products").onSnapshot(s => put("products", (s.exists && s.data().items) || {}), fail);
    db.doc("settings/pos").onSnapshot(s => put("barcodes", (s.exists && s.data().barcodes) || {}), fail);
    window.addEventListener("online", () => { this.backoff = 2000; this.kick(); });
    window.addEventListener("offline", () => this.set("offline"));
    setInterval(() => { if (outbox.length) this.kick(); }, 20000);
    const user = await window.claude.use("user");
    if (user && (await user.can("data.write")) === false) { S.canWrite = false; render(); }
    this.kick();
  },
  flushLocal() {                 // no shared store: the outbox folds straight into this device's copy
    for (const op of outbox) applyOp(base, op);
    outbox = []; saveOutbox(); saveBase();
    this.set("local"); rebuild();
  },
  kick() {
    if (!this.started) return;          // still finding out where this shop's data lives
    if (!this.db) { this.flushLocal(); return; }
    if (this.busy) return;
    this.flush();
  },
  async flush() {
    if (!navigator.onLine) { this.set("offline"); return; }
    if (!outbox.length) { this.set("synced"); return; }
    this.busy = true; this.set("syncing");
    try {
      while (outbox.length) {
        await pushOp(outbox[0]);
        applyOp(base, outbox[0]); saveBase();      // keep it on screen until the store echoes it back
        outbox.shift(); saveOutbox(); drawSync();
      }
      this.backoff = 2000;
      S.lastSync = new Date().toISOString();
      this.set("synced");
    } catch (e) {
      if (e?.code === "invalid_argument") {          // not allowed to save: drop it, tell the viewer
        outbox.shift(); saveOutbox(); S.canWrite = false; toast(t("readonly"));
      } else if (e?.code === "quota_exceeded") {
        this.set("retry"); toast(e.message || "Storage is full.");
      } else {
        this.set(navigator.onLine ? "retry" : "offline");
        clearTimeout(this.timer);
        this.timer = setTimeout(() => this.kick(), this.backoff);
        this.backoff = Math.min(this.backoff * 2, 60000);
      }
    } finally {
      this.busy = false;
      rebuild();
      if (outbox.length && S.sync === "synced") this.kick();
    }
  },
};
async function withLease(path, fn) {
  const ref = Sync.db.doc(path);
  for (let i = 0; i < 25; i++) {
    let r;
    try { r = await ref.acquire({holder: DEVICE, ttlMs: 5000}); }
    catch (e) {
      if (e?.code === "invalid_argument" || e?.code === "not_granted" || e?.code === "revoked") throw e;
      return fn();                                  // no lease available here: save anyway
    }
    if (r.acquired) return fn();
    await new Promise(res => setTimeout(res, 400 + Math.random() * 600));   // another phone is saving
  }
  throw {code: "unavailable", message: "busy"};
}
async function updateDoc(path, change) {       // read, change, write — one phone at a time
  return withLease(path, async () => {
    const ref = Sync.db.doc(path);
    const snap = await ref.get();
    const next = change(snap.exists ? snap.data() : null);
    if (next) await ref.set(next);
  });
}
async function pushOp(op) {
  const db = Sync.db;
  if (STOCK_KINDS.has(op.kind)) await updateDoc("shop/stock", cur => {
    const st = cur && cur.counts ? clone(cur) : null;
    if (op.kind === "setup_stock") return st ? null : op.stock;
    if (st && st.applied?.includes(op.id)) return null;          // already saved by an earlier try
    const s = applyOp({stock: st || seedStock(), deliveries: {}, orders: {}, scans: {}, barcodes: {}, writeoffs: {}}, op).stock;
    s.updated_at = new Date().toISOString();
    return s;
  });
  if (op.kind === "receive") await db.doc("deliveries/" + op.rec.id).set(op.rec);
  if (op.kind === "order_sent") await db.doc("orders/" + op.key).set(op.rec);
  if (op.kind === "payment") await db.doc("payments/" + op.rec.id).set(op.rec);
  if (op.kind === "add_product") await updateDoc("settings/products", cur => ({items: {...(cur?.items || {}), [op.product.sku_id]: op.product}}));
  if (op.kind === "supplier") await updateDoc("settings/suppliers", cur => ({items: {...(cur?.items || {}), [op.sup.id]: op.sup}}));
  if (op.kind === "price_list") await updateDoc("settings/pricelists", cur => ({items: {...(cur?.items || {}), [op.supplier_id]: {rates: op.rates, at: op.at}}}));
  if (op.kind === "shop_details") await updateDoc("settings/shop", cur => ({...(cur || {}), ...op.details}));
  if (op.kind === "subscribe") await updateDoc("settings/plan", () => op.sub);
  if (op.kind === "order_confirm") await updateDoc("orders/" + op.key, cur =>
    !cur || (cur.token && op.token && cur.token !== op.token) || cur.status === "confirmed" ? null
      : {...cur, status: "confirmed", confirmed_at: op.at, confirmed_by: op.by || null});
  if (op.kind === "link_barcode") await updateDoc("settings/pos", cur => ({barcodes: {...(cur?.barcodes || {}), [op.code]: op.sku}}));
  if (op.kind === "sell") await updateDoc("scans/" + op.day, cur => mergeScans(cur, op, op.day, op.units));
  if (op.kind === "csv_sales") for (const [day, units] of Object.entries(op.days))
    await updateDoc("scans/" + day, cur => mergeScans(cur, op, day, units));
  if (op.kind === "remove") {
    const m = op.at.slice(0, 7);
    await updateDoc("writeoffs/" + m, cur => {
      const w = cur && cur.entries ? cur : {entries: []};
      return w.entries.some(e => e.id === op.id) ? null : {entries: [...w.entries, writeoffEntry(op)]};
    });
  }
}
function drawSync() {
  const el = $("#sync");
  if (!el) return;
  const n = outbox.length;
  const map = {local: ["info", t("sync_local")], synced: ["ok", "✓ " + t("sync_ok")],
               syncing: ["info", t("sync_busy", {n})], offline: ["low", n ? t("sync_off", {n}) : t("sync_off0")], retry: ["out", t("sync_retry", {n})]};
  const [cls, text] = map[S.sync] || map.local;
  el.className = "pill " + cls;
  el.textContent = text;
}

/* bill photos taken while offline wait here (IndexedDB) until they can be read */
const BillQueue = {
  db: null,
  async open() {
    if (this.db) return this.db;
    this.db = await new Promise((res, rej) => {
      const r = indexedDB.open("shelfsense-bills", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("bills", {keyPath: "id"});
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return this.db;
  },
  async tx(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction("bills", mode); const out = fn(tx.objectStore("bills"));
      tx.oncomplete = () => res(out?.result ?? out); tx.onerror = () => rej(tx.error);
    });
  },
  async add(sid, files) {
    const item = {id: newId(), sid, at: new Date().toISOString(), files: files.map(f => ({name: f.name, type: f.type, blob: f}))};
    await this.tx("readwrite", s => s.put(item));
    await this.load();
  },
  async remove(id) { await this.tx("readwrite", s => s.delete(id)); await this.load(); },
  async load() {
    try { S.pendingBills = await this.tx("readonly", s => s.getAll()) || []; }
    catch (e) { S.pendingBills = []; }
    render();
  },
};

/* expiry: which batches won't sell before they expire, at the usual daily sales */
function expiryAlerts(st, today = todayISO(), horizon = Prefs.expiryWindow) {
  if (!st) return [];
  const out = [];
  for (const c of DATA.catalogue) {
    const sku = c.sku_id;
    if (!(st.counts?.[sku] > 0)) continue;
    const lots = [...lotsOf(clone(st), sku)].sort((a, b) => a.exp < b.exp ? -1 : 1);
    const rate = rateOf(sku);
    let before = 0;
    for (const l of lots) {
      const d = daysBetween(today, l.exp);
      if (d > horizon) break;
      const leftover = d < 0 ? l.qty : Math.max(0, l.qty - Math.max(0, rate * (d + 1) - before));
      before += l.qty;
      if (leftover < 0.5) continue;
      out.push({sku, lid: l.lid, exp: l.exp, est: l.est, days: d, qty: l.qty, unsold: Math.round(leftover),
                value: leftover * (DATA.cost[sku] || 0), action: d < 0 ? "remove" : d <= 2 ? "discount" : "push"});
    }
  }
  return out.sort((a, b) => a.days - b.days || b.value - a.value);
}

function orderedFor(sid) {
  const sent = S.orders[DATA.date + "_" + sid];
  const lines = sent ? sent.lines : orderLines(sid);
  const m = {};
  for (const l of lines) m[l.sku_id] = (m[l.sku_id] || 0) + l.qty;
  return m;
}
function deliveryFor(sid) { return Object.values(S.deliveries).find(d => d.supplier_id === sid && d.order_date === DATA.date); }

function checkBill(r) {
  const cards = DATA.cards[r.supplier_id] || {};
  const billed = {};
  const issues = [];
  for (const l of r.lines) {
    if (!l.sku_id) { issues.push({type: "unknown", sev: "bad", p: l.text}); continue; }
    billed[l.sku_id] = (billed[l.sku_id] || 0) + Number(l.qty || 0);
    const card = cards[l.sku_id];
    if (card && l.rate != null) {
      if (Math.abs(l.rate - card) <= 0.005 * card) { l.rate = card; l.amount = Math.round(l.qty * card * 100) / 100; }
      else if (l.rate > card) issues.push({type: "price_up", sev: "warn", sku: l.sku_id, p: CAT[l.sku_id].name, r: rupee2(l.rate), e: rupee2(card),
        x: ((l.rate / card - 1) * 100).toFixed(1), c: rupee((l.rate - card) * l.qty)});
      else issues.push({type: "price_down", sev: "good", sku: l.sku_id, p: CAT[l.sku_id].name, r: rupee2(l.rate), e: rupee2(card)});
    }
  }
  const ordered = r.ordered || {};
  for (const sku of new Set([...Object.keys(ordered), ...Object.keys(billed)])) {
    const o = ordered[sku] || 0, b = billed[sku] || 0, p = CAT[sku].name;
    if (o && !b) issues.push({type: "missing", sev: "bad", sku, p, o});
    else if (o && b < o) issues.push({type: "short", sev: "bad", sku, p, o, b});
    else if (o && b > o) issues.push({type: "over", sev: "warn", sku, p, o, b});
    else if (b && !o && Object.keys(ordered).length) issues.push({type: "extra", sev: "warn", sku, p, b});
  }
  const linesTotal = r.lines.reduce((a, l) => a + Number(l.amount || (l.qty || 0) * (l.rate || 0)), 0);
  if (r.bill_total != null && Math.abs(linesTotal - r.bill_total) > 1)
    issues.push({type: "total", sev: "warn", a: rupee2(r.bill_total), b: rupee2(linesTotal)});
  const rank = {missing: 0, short: 1, unknown: 2, price_up: 3, extra: 4, over: 5, total: 6, price_down: 7};
  issues.sort((a, b) => rank[a.type] - rank[b.type]);
  r.issues = issues; r.received = billed; r.lines_total = Math.round(linesTotal * 100) / 100;
  return r;
}
function issueText(i) {
  const key = {missing: "i_missing", short: "i_short", over: "i_over", extra: "i_extra", unknown: "i_unknown",
               price_up: "i_price_up", price_down: "i_price_down", total: "i_total"}[i.type];
  const vars = {...i, p: i.sku && CAT[i.sku] ? nameOf(i.sku) : i.p};   // product names follow the language
  return t(key, Object.fromEntries(Object.entries(vars).map(([k, v]) => [k, k === "p" ? esc(v) : v])));
}

async function readBill(sid, files, queuedId = null) {
  if (!navigator.onLine) {                      // no connection: keep the photo and read it later
    if (!queuedId) { await BillQueue.add(sid, files).catch(() => {}); toast(t("bill_queued")); }
    else toast(t("offline_read"));
    return;
  }
  if (!S.sample) { toast(t("bill_off")); return; }
  const ctl = new AbortController();
  S.reading = {sid, ctl}; S.review = null; render();
  try {
    const out = await S.sample.json(billPrompt(sid, files.length), {images: files, signal: ctl.signal, modelTier: "default", cache: false});
    let lines = Array.isArray(out?.lines) ? out.lines : [];
    lines = lines.map(l => ({text: String(l.text || "").slice(0, 80), sku_id: CAT[l.sku_id] ? l.sku_id : null,
                             qty: Number(l.qty) || 0, rate: l.rate == null ? null : Number(l.rate), amount: Number(l.amount) || 0,
                             expiry: /^\d{4}-\d{2}-\d{2}$/.test(l.expiry || "") ? l.expiry : null}));
    if (!lines.length) throw {code: "empty_bill"};
    let useSid = sid;
    const printed = String(out.supplier_name || "").toLowerCase();
    const other = DATA.suppliers.find(s => printed && printed.includes(s.name.toLowerCase().split(" ")[0]));
    if (other && other.id !== sid) { useSid = other.id; toast(t("wrong_sup", {s: other.name})); }
    S.review = checkBill({supplier_id: useSid, source: "photo", files, invoice_no: out.invoice_no || null,
      bill_date: /^\d{4}-\d{2}-\d{2}$/.test(out.bill_date || "") ? out.bill_date : todayISO(),
      bill_total: out.bill_total == null ? null : Number(out.bill_total), lines, ordered: orderedFor(useSid)});
    if (queuedId) BillQueue.remove(queuedId);
  } catch (e) {
    const code = e?.code;
    if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(code)) {
      S.sample = null; toast(t("bill_off"));
    } else if (code === "images_unavailable") { S.imagesOK = false; toast(t("bill_off")); }
    else if (code === "rate_limited") toast("Too many requests just now. Try again in a minute.");
    else if (code !== "cancelled") toast(t("bill_err"));
  } finally { S.reading = null; render(); }
}

    received: r.received, expiry: Object.fromEntries(Object.entries(expiry).filter(([k]) => known[k])),
    issues: r.issues.map(i => ({...i, text: issueText(i).replace(/<[^>]+>/g, "")})),   // text: for the computer side
    lines: r.lines.map(({text, sku_id, qty, rate, amount, expiry}) => ({text, sku_id, qty, rate, amount, expiry: expiry || null})),
    confirmed_at: new Date().toISOString(), confirmed_by: Auth.user?.name || null, bill_assets: [],

    for (const f of r.files) {

  }
  S.review = null;
  if (commit("receive", {rec, expiry, expiry_known: known})) toast(t("saved_deliv", {n}));
  render();
}

function addScan(code) {

    box.innerHTML = `<div class="issues unknown-box"><li class="warn" style="list-style:none"><span>!</span><span class="grow">${t("unknown_code", {c: esc(code)})}

    box.querySelector("#link-x").onclick = () => { box.innerHTML = ""; };
    productPicker(box.querySelector("#link-pick"), {code: digits, label: t("link_to"), onPick: sku => {
      if (CAT[sku]?.ean !== digits) commit("link_barcode", {code: digits, sku});
      box.innerHTML = ""; addScan(digits);
    }});
    return;
  }
  box.innerHTML = "";
  beep();

  if (hit) hit.qty += 1; else S.cart.push({sku_id: sku, qty: 1});

}
function drawCart() {
  const ul = $("#cart"), btns = $("#cart-btns");
  if (!ul) return;

  if (!n && S.cartPayment) S.cartPayment = null;
  const pay = S.cartPayment && S.payments[S.cartPayment];
  const total = S.cart.reduce((a, x) => a + x.qty * CAT[x.sku_id].mrp, 0);
  ul.innerHTML = S.cart.map((x, i) => `<li><span>${esc(nameOf(x.sku_id))}</span><span class="num stepper">

    + (pay ? `<li><span>${t("pay_total")}</span><span class="num" style="color:${Math.abs(total - pay.amount) < 1 ? "var(--ok)" : "var(--out)"}">${rupee2(total)} / ${rupee2(pay.amount)}</span></li>` : "");
  ul.querySelectorAll("[data-cartm]").forEach(b => b.onclick = () => {

    <button type="button" class="btn small" id="clear">${t("clear")}</button>` : "";

    else if (commit("sell", {day: todayISO(), units, bills: 1})) { S.cart = []; toast(t("sale_done", {n})); }
    render();
    $("#scan-in")?.focus();
  };
}

/* CSV export from billing software */
function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()));
}
const HINTS = {barcode: ["barcode", "ean", "item code", "itemcode", "sku code", "product code", "upc"],
               name: ["item name", "item", "product", "description", "particulars"],
               qty: ["qty", "quantity", "units", "pcs"], date: ["bill date", "date", "invoice date"]};
function findCols(header) {
  const low = header.map(h => h.trim().toLowerCase()), cols = {};
  for (const [key, hints] of Object.entries(HINTS)) {
    for (const h of hints) {
      let i = low.indexOf(h);
      if (i < 0) i = low.findIndex((x, j) => x.includes(h) && !Object.values(cols).includes(j));
      if (i >= 0) { cols[key] = i; break; }
    }
  }
  if (cols.qty == null || cols.date == null || (cols.barcode == null && cols.name == null))
    throw new Error("needs columns for date, quantity and barcode or item name");
  return cols;
}
function parseDay(s) {
  s = String(s).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if (m) { const y = m[3].length === 2 ? "20" + m[3] : m[3]; return `${y}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`; }
  throw new Error(`can't read the date "${s}"`);
}
const normName = s => String(s).toUpperCase().replace(/'/g, "").replace(/[^A-Z0-9]+/g, " ").trim().split(" ")
  .map(w => ({BISC: "BISCUITS", DET: "DETERGENT", PWD: "POWDER", SHMP: "SHAMPOO", NDL: "NOODLES", SD: "SOFT DRINK"}[w] || w)).join(" ");
const NAME_IDX = Object.fromEntries(DATA.catalogue.map(c => [normName(c.name), c.sku_id]));
$("#csv-file").onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const rows = parseCSV(await f.text());
    const cols = findCols(rows[0]);
    const days = {}, unm = {};
    let lines = 0, matched = 0, total = 0;
    for (const r of rows.slice(1)) {
      const day = parseDay(r[cols.date]);
      const qty = Number(r[cols.qty]) || 0;
      const code = cols.barcode != null ? String(r[cols.barcode] || "").replace(/\D/g, "") : "";
      const name = cols.name != null ? r[cols.name] : "";
      const sku = (code && skuForCode(code)) || NAME_IDX[normName(name)] || null;
      lines++; total += qty;
      if (sku) { matched += qty; (days[day] ||= {})[sku] = ((days[day] || {})[sku] || 0) + qty; }
      else unm[name || code || "?"] = (unm[name || code || "?"] || 0) + qty;
    }
    S.csv = {file: f.name, lines, days, unm, pct: total ? Math.round(100 * matched / total) : 0};
  } catch (err) { S.csv = {error: err.message}; }
  drawCsv();
};
function drawCsv() {
  const box = $("#csv-box");
  if (!box || !S.csv) return;
  if (S.csv.error) { box.innerHTML = `<p class="note" style="color:var(--out)">${t("csv_bad", {e: esc(S.csv.error)})}</p>`; return; }
  const c = S.csv;
  const top = Object.entries(c.unm).sort((a, b) => b[1] - a[1]).slice(0, 4).map(([k, v]) => `${esc(k)} (${v})`).join(", ");
  const cd0 = S.stock?.count_date || DATA.stock.count_date;
  const older = Object.keys(c.days).filter(d => d < cd0).length;
  box.innerHTML = `<p class="note num">${t("csv_prev", {f: esc(c.file), l: c.lines, d: Object.keys(c.days).length, m: c.pct})}</p>
    ${top ? `<p class="note">${t("csv_unm", {x: top})}</p>` : ""}
    ${older ? `<label class="checkline"><input type="checkbox" id="csv-all" ${c.all ? "checked" : ""}> ${t("csv_all", {n: older, c: fmtDate(cd0)})}</label>` : ""}
    <div class="btns"><button type="button" class="btn primary" id="csv-use">${t("csv_use")}</button></div>`;
  box.querySelector("#csv-all")?.addEventListener("change", e => { c.all = e.target.checked; });
  box.querySelector("#csv-use").onclick = () => {
    const cd = S.stock?.count_date || DATA.stock.count_date;
    let n = 0;
    for (const [day, units] of Object.entries(c.days)) if (c.all || day >= cd) n += Object.values(units).reduce((a, b) => a + b, 0);
    if (!S.stock) commit("setup_stock", {stock: seedStock()});
    if (commit("csv_sales", {days: c.days, file: c.file, all: !!c.all})) {
      toast(t(c.all ? "csv_done_all" : "csv_done", {d: Object.keys(c.days).length, n, c: fmtDate(cd)}));
      S.csv = null;
    }
    render();
  };
}

/* ------------------------------------------------------------------ products: the shop's own list + Open Food Facts
   The built-in list has the products the practice data uses. A shop can add more:
   from the bundled Open Food Facts list for India (searchable), from an online barcode
   lookup, or by typing a name and price. Added products are saved with the shop. */
const OFF = (DATA.off_products || []).map(([code, name, brand, qty, cat]) => ({code, name, brand, qty, cat}));
const OFF_BY_CODE = new Map(OFF.map(p => [p.code, p]));
const CAT_DAYS = {Dairy: 7, Beverages: 180, Biscuits: 180, Snacks: 120, Confection: 270, Noodles: 270, Staples: 365,
                  Oil: 270, Spices: 365, Spreads: 270, Personal: 730, "Home Care": 730, Other: 365};
const offTitle = p => [p.brand && !p.name.toLowerCase().includes(p.brand.toLowerCase()) ? p.brand : "", p.name, p.qty].filter(Boolean).join(" ");
const offSku = code => "OFF" + code;
function useProducts(products) {          // make the shop's added products behave like built-in ones
  for (const p of Object.values(products || {})) {
    if (!p?.sku_id) continue;
    if (!CAT[p.sku_id]) DATA.catalogue.push(p);
    else Object.assign(CAT[p.sku_id], p);
    CAT[p.sku_id] = DATA.catalogue.find(c => c.sku_id === p.sku_id);
    if (p.ean) EAN[p.ean] = p.sku_id;
    NAME_IDX[normName(p.name)] = p.sku_id;
    DATA.shelf_days[p.sku_id] ||= CAT_DAYS[p.category] || 365;
    DATA.cost[p.sku_id] ??= Math.round((p.price || 0) * 0.85 * 100) / 100;   // rough buying price until a bill says otherwise
  }
}
function norm(s) { return String(s || "").toLowerCase().normalize("NFKD").replace(/[^a-z0-9ऀ-ॿ ]+/g, " ").replace(/\s+/g, " ").trim(); }
function searchProducts(q, limit = 8) {
  const words = norm(q).split(" ").filter(Boolean);
  const digits = String(q).replace(/\D/g, "");
  if (!words.length) return [];
  const hit = text => words.every(w => (" " + text).includes(" " + w));     // words start with what was typed
  const mine = [], seen = new Set();
  for (const c of DATA.catalogue) {
    const text = norm(`${c.name} ${c.name_hi || ""} ${c.ean || ""}`);
    if (hit(text) || (digits.length >= 6 && (c.ean || "").includes(digits))) {
      mine.push({kind: "mine", sku: c.sku_id, title: nameOf(c.sku_id), sub: c.price ? rupee2(c.price) : "", counted: c.sku_id in (S.stock?.counts || {})});
      if (c.ean) seen.add(c.ean);
    }
  }
  mine.sort((a, b) => b.counted - a.counted);
  const off = [];
  for (const p of OFF) {
    if (off.length >= limit || seen.has(p.code)) continue;
    if (hit(norm(`${p.brand} ${p.name} ${p.qty} ${p.code}`)) || (digits.length >= 6 && p.code.includes(digits)))
      off.push({kind: "off", code: p.code, title: offTitle(p), sub: p.cat || ""});
  }
  return [...mine.slice(0, limit), ...off].slice(0, limit + 4);
}
async function lookupBarcode(code) {       // bundled list first, then the Open Food Facts website (one request per scan)
  if (OFF_BY_CODE.has(code)) return {...OFF_BY_CODE.get(code), from: "list"};
  if (!HOSTED || !navigator.onLine) return {error: true};
  try {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 6000);
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=code,product_name,product_name_en,brands,quantity,categories_tags`,
                          {signal: ctl.signal});
    clearTimeout(timer);
    if (!r.ok) return null;
    const j = await r.json();
    const p = j.product;
    const name = p && (p.product_name_en || p.product_name);
    if (!name) return null;
    return {code, name, brand: String(p.brands || "").split(",")[0].trim(), qty: p.quantity || "", cat: offCategory(p.categories_tags || [], name), from: "online"};
  } catch (e) { return {error: true}; }
}
const OFF_CAT_RULES = [["Dairy", /\bmilks?\b|dairies|dairy|yogurt|curd|paneer|cheese|butter|ghee|dahi|lassi/], ["Beverages", /beverage|drink|water|juice|\btea|coffee|soda|cola|squash|syrup/],
  ["Biscuits", /biscuit|cookie|cracker|rusk|wafer/], ["Noodles", /noodle|pasta|vermicelli|macaroni/], ["Confection", /chocolate|cand(y|ies)|confection|sweets|chewing|toffee/],
  ["Snacks", /snack|chips|crisps|namkeen|bhujia|popcorn/], ["Oil", /\boils?\b|vanaspati/], ["Staples", /flour|atta|rice|cereal|grain|pulse|lentil|\bdals?\b|sugar|legume|oats|flakes|bread/], ["Spices", /spice|masala|condiment|\bsalts?\b|pickle|seasoning/],
  ["Spreads", /spread|jam|sauce|ketchup|honey|chutney/],
  ["Personal", /soap|shampoo|toothpaste|cosmetic|hygiene|deodorant/], ["Home Care", /detergent|cleaning|dishwash|cleaner/]];
function offCategory(tags, name = "") {
  const s = (tags.join(" ").replace(/foods-and-beverages/g, "foods") + " " + name).toLowerCase().replace(/-/g, " ");
  return (OFF_CAT_RULES.find(([, re]) => re.test(s)) || ["Other"])[0];
}
const CATEGORY_LIST = ["Staples", "Dairy", "Beverages", "Biscuits", "Snacks", "Confection", "Noodles", "Oil", "Spices", "Spreads", "Personal", "Home Care", "Other"];

/* A search box that finds a product (shop list, Open Food Facts list) or creates one.
   onPick(sku) is called once a product is chosen or added. `code` = the scanned barcode, if any. */
function productPicker(box, {code = "", onPick, label = t("cnt_pick")}) {
  const st = {q: "", adding: null, looking: false, looked: null};
  const draw = () => {
    const results = st.q.trim().length >= 2 ? searchProducts(st.q) : [];
    const a = st.adding;
    box.innerHTML = `
      ${code ? `<p class="note" style="margin:6px 0">${st.looking ? t("off_looking") : st.looked?.name ? t("off_found") : st.looked?.error ? t("off_cant") : st.looked ? t("off_notfound") : ""}</p>` : ""}
      ${st.looked?.name && !a ? `<button type="button" class="pick off" data-found="1"><span><strong>${esc(offTitle(st.looked))}</strong>
          <small>${esc(t("off_badge"))} · ${esc(code)}</small></span><span class="add">${t("off_add")}</span></button>` : ""}
      ${a ? `<form class="stack pick-form" novalidate>
          <strong>${t("new_product")}</strong>
          <label class="field"><span>${t("f_pname")}</span><input class="text" id="np-name" maxlength="80" value="${esc(a.name)}"></label>
          <div class="pick-row">
            <label class="field"><span>${t("f_price")}</span><input class="text" id="np-price" type="number" min="0" step="0.5" inputmode="decimal" value="${a.price ?? ""}"></label>
            <label class="field"><span>${t("f_cat")}</span><select class="sel" id="np-cat">${CATEGORY_LIST.map(c => `<option ${c === a.cat ? "selected" : ""}>${c}</option>`).join("")}</select></label>
          </div>
          ${a.code ? `<p class="note">${t("barcode")}: ${esc(a.code)}${a.src === "off" ? " · " + t("off_badge") : ""}</p>` : ""}
          <p class="err" role="alert">${esc(a.err || "")}</p>
          <div class="btns"><button class="btn primary" type="submit">${t("off_add")}</button><button class="btn small" type="button" id="np-cancel">${t("cancel")}</button></div>
        </form>` : `
      <label class="field"><span>${label}</span>
        <input class="text" type="search" id="pp-q" placeholder="${t("pick_ph")}" value="${esc(st.q)}" autocomplete="off"></label>
      <div class="picks" role="list">${results.map((r, i) => `<button type="button" class="pick ${r.kind}" data-i="${i}" role="listitem">
          <span><strong>${esc(r.title)}</strong><small>${r.kind === "off" ? esc(t("off_badge")) + (r.sub ? " · " + esc(r.sub) : "") : esc(r.sub || "")}${r.counted ? " · " + t("counted_short") : ""}</small></span>
          <span class="add">${r.kind === "off" ? t("off_add") : "+"}</span></button>`).join("")}
        ${st.q.trim().length >= 2 ? `<button type="button" class="pick new" data-new="1"><span><strong>${t("new_named", {n: esc(st.q.trim())})}</strong></span><span class="add">+</span></button>` : ""}
      </div>
      ${OFF.length ? `<p class="note credit">${t("off_credit")}</p>` : ""}`}`;
    const qi = box.querySelector("#pp-q");
    if (qi) {
      qi.oninput = () => { st.q = qi.value; const pos = qi.selectionStart; draw(); const n = box.querySelector("#pp-q"); n.focus(); n.setSelectionRange(pos, pos); };
      box.querySelectorAll("[data-i]").forEach(b => b.onclick = () => {
        const r = results[Number(b.dataset.i)];
        if (r.kind === "mine") { onPick(r.sku); st.q = ""; draw(); return; }
        const p = OFF_BY_CODE.get(r.code);
        st.adding = {name: offTitle(p), code: p.code, cat: CATEGORY_LIST.includes(p.cat) ? p.cat : "Other", src: "off"};
        draw();
      });
      box.querySelector("[data-new]")?.addEventListener("click", () => { st.adding = {name: st.q.trim(), code, cat: "Other", src: "manual"}; draw(); });
    }
    box.querySelector("[data-found]")?.addEventListener("click", () => {
      const p = st.looked;
      st.adding = {name: offTitle(p), code: p.code, cat: CATEGORY_LIST.includes(p.cat) ? p.cat : "Other", src: "off"};
      draw();
    });
    const form = box.querySelector(".pick-form");
    if (form) {
      form.querySelector("#np-name").focus();
      form.querySelector("#np-cancel").onclick = () => { st.adding = null; draw(); };
      form.onsubmit = e => {
        e.preventDefault();
        const name = form.querySelector("#np-name").value.trim();
        const price = Number(form.querySelector("#np-price").value);
        a.name = name; a.price = form.querySelector("#np-price").value; a.cat = form.querySelector("#np-cat").value;
        if (!name) { a.err = t("need_field", {f: t("f_pname")}); return draw(); }
        if (!(price > 0)) { a.err = t("price_needed"); return draw(); }
        if (a.code && EAN[a.code]) { onPick(EAN[a.code]); return; }
        const sku = a.code ? offSku(a.code) : "OWN" + newId().replace(/[^A-Za-z0-9]/g, "").slice(-10);
        const product = {sku_id: sku, name, category: a.cat, mrp: price, price, ean: a.code || "", source: a.src,
                         added_at: new Date().toISOString(), added_by: Auth.user?.name || null};
        if (commit("add_product", {product})) { toast(t("product_added", {n: name})); onPick(sku); }
      };
    }
  };
  draw();
  if (code) {
    st.looking = true; draw();
    lookupBarcode(code).then(p => { st.looking = false; st.looked = p || {}; if (box.isConnected) draw(); });
  }
}

/* ------------------------------------------------------------------ shop details, wholesalers, price lists
   The shop keeps: where it is (for finding wholesalers nearby), its own wholesaler list,
   and each wholesaler's price list. From those, the app works out what to order from whom. */
const HOSTED = !!window.SHELFSENSE_CONFIG;      // true in the installed app, false inside the claude.ai page
const PLACES = window.SHELFSENSE_CONFIG?.placesUrl || "";   // Mappls lookup through your own server
const MAPPLS_KEY = window.SHELFSENSE_CONFIG?.mapplsKey || "";   // or a single Mappls REST key, used from the phone
const HAS_PLACES = !!(PLACES || MAPPLS_KEY);
const SEC_QUESTIONS = ["q_school", "q_street", "q_pet", "q_teacher", "q_food"];
const cleanAnswer = a => String(a || "").toLowerCase().replace(/[^a-z0-9ऀ-ॿ]+/g, "");

/* ---- where the shop is (Nominatim = OpenStreetMap's address search) */
async function geocode(q) {
  if (!HOSTED) throw {code: "blocked", message: t("net_blocked")};
  const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=in&q=${encodeURIComponent(q)}`;
  const r = await fetch(url, {headers: {Accept: "application/json"}});
  if (!r.ok) throw {message: t("net_bad")};
  const j = await r.json();
  if (!j.length) throw {message: t("loc_notfound")};
  return {lat: Number(j[0].lat), lon: Number(j[0].lon), label: j[0].display_name};
}
/* ---- wholesalers straight from Mappls with a single REST key (installed app only) */
const MAPPLS_KEYWORDS = ["wholesale", "cash and carry", "kirana store", "grocery store", "distributor"];
async function mapplsGet(path, params) {
  const r = await fetch(`https://apis.mappls.com/advancedmaps/v1/${encodeURIComponent(MAPPLS_KEY)}/${path}?` + new URLSearchParams(params));
  if (r.status === 401 || r.status === 412) throw {message: t("mappls_key_bad")};
  if (!r.ok) throw {message: t("net_bad")};
  return r.json();
}
async function mapplsNearby({place, refLocation, radius = 5000}) {
  let ref = refLocation;
  let label = null;
  if (!ref) {
    const g = await mapplsGet("geo_code", {addr: place});
    const hit = (g?.results || g?.copResults ? [].concat(g.results || g.copResults) : [])[0];
    if (!hit) throw {message: t("loc_notfound")};
    ref = `${hit.lat ?? hit.latitude},${hit.lng ?? hit.longitude}`;
    label = hit.formatted_address || hit.placeAddress || place;
  }
  const seen = new Map();
  for (const keywords of MAPPLS_KEYWORDS) {
    let j;
    try { j = await mapplsGet("nearby_search", {keywords, refLocation: ref, radius, sortBy: "dist:asc"}); }
    catch (e) { if (e?.message === t("mappls_key_bad")) throw e; continue; }
    for (const x of (j?.suggestedLocations || j?.results || [])) {
      const id = x.eLoc || `${x.placeName}|${x.placeAddress}`;
      if (!x.placeName || seen.has(id)) continue;
      seen.set(id, {name: String(x.placeName).slice(0, 60), address: String(x.placeAddress || "").slice(0, 120),
                    phone: String(x.mobileNo || x.landlineNo || "").split(",")[0].replace(/[^\d+]/g, ""),
                    km: Math.round((Number(x.distance) || 0) / 100) / 10, eloc: x.eLoc || null, source: "mappls"});
    }
    if (seen.size >= 25) break;
  }
  return {place: label, list: [...seen.values()].sort((a, b) => a.km - b.km).slice(0, 25)};
}

/* ---- wholesalers near the shop (Overpass = OpenStreetMap's map-data search) */
async function nearbyWholesalers(lat, lon, radius = 5000) {
  if (!HOSTED) throw {code: "blocked", message: t("net_blocked")};
  const q = `[out:json][timeout:25];(
    node(around:${radius},${lat},${lon})[shop~"^(wholesale|supermarket|convenience|grocery|trade)$"];
    way(around:${radius},${lat},${lon})[shop~"^(wholesale|supermarket|convenience|grocery|trade)$"];
    node(around:${radius},${lat},${lon})[office=wholesale];
    node(around:${radius},${lat},${lon})[shop=department_store];);out center tags 60;`;
  const r = await fetch("https://overpass-api.de/api/interpreter", {method: "POST", body: "data=" + encodeURIComponent(q),
    headers: {"Content-Type": "application/x-www-form-urlencoded"}});
  if (!r.ok) throw {message: t("net_bad")};
  const j = await r.json();
  const km = (a, b, c, d) => {
    const R = 6371, p = Math.PI / 180;
    return 2 * R * Math.asin(Math.sqrt(Math.sin((c - a) * p / 2) ** 2 + Math.cos(a * p) * Math.cos(c * p) * Math.sin((d - b) * p / 2) ** 2));
  };
  return (j.elements || []).map(e => {
    const tg = e.tags || {};
    const p = e.center || e;
    const addr = [tg["addr:housenumber"], tg["addr:street"], tg["addr:suburb"], tg["addr:city"], tg["addr:postcode"]].filter(Boolean).join(", ");
    return {osm: e.type + "/" + e.id, name: tg.name || tg.operator || "", phone: tg.phone || tg["contact:phone"] || "",
            address: addr, kind: tg.shop || tg.office || "", km: Math.round(km(lat, lon, p.lat, p.lon) * 10) / 10};
  }).filter(x => x.name).sort((a, b) => a.km - b.km).slice(0, 25);
}

/* ---- price lists: what each wholesaler charges for a product */
const priceOf = (sid, sku) => S.pricelists?.[sid]?.rates?.[sku]?.rate ?? null;
function supplierStats(sid) {
  const list = S.pricelists?.[sid];
  const skus = Object.keys(list?.rates || {});
  let best = 0;
  for (const sku of skus) {
    const mine = priceOf(sid, sku);
    const others = DATA.suppliers.filter(s => s.id !== sid).map(s => priceOf(s.id, sku)).filter(x => x != null);
    if (mine != null && others.every(o => mine <= o)) best++;
  }
  const dels = Object.values(S.deliveries).filter(d => d.supplier_id === sid);
  const issues = dels.reduce((a, d) => a + (d.issues || []).filter(i => i.sev === "bad").length, 0);
  return {items: skus.length, best, deliveries: dels.length, issues, at: list?.at || null,
          onTime: dels.length ? Math.round(100 * (dels.length - dels.filter(d => (d.issues || []).some(i => i.type === "missing" || i.type === "short")).length) / dels.length) : null};
}
function bestSupplier(sku) {            // cheapest wholesaler that lists this product; faster delivery breaks a tie
  const opts = DATA.suppliers.map(s => ({s, rate: priceOf(s.id, sku)})).filter(x => x.rate != null);
  if (!opts.length) return null;
  opts.sort((a, b) => a.rate - b.rate || a.s.lead_hours - b.s.lead_hours || b.s.credit_days - a.s.credit_days);
  return {pick: opts[0], alternatives: opts.slice(1)};
}
/* Today's order list for a shop that has its own price lists (the example shop keeps the
   list built by the reorder engine). Order when the shelf runs out before the next delivery. */
const COVER_DAYS = 10;
function buildOrderLines() {
  const st = S.stock;
  if (!st) return [];
  const lines = [];
  for (const sku of Object.keys(st.counts || {})) {
    if (!CAT[sku]) continue;
    const rate = rateOf(sku);
    const on_hand = Math.round(st.counts[sku] || 0);
    const choice = bestSupplier(sku);
    if (!choice || rate <= 0) continue;
    const {pick, alternatives} = choice;
    const leadDays = Math.max(0.5, (pick.s.lead_hours || 24) / 24);
    const days_left = on_hand / rate;
    if (days_left > leadDays + 2) continue;                       // still enough on the shelf
    const info = S.pricelists[pick.s.id].rates[sku] || {};
    const pack_size = Math.max(1, Math.round(info.pack || 1));
    const min_packs = Math.max(1, Math.round(info.moq || 1));
    const need = Math.max(0, rate * (COVER_DAYS + leadDays) - on_hand);
    const packs = Math.max(min_packs, Math.ceil(need / pack_size));
    const shelfDays = shelf(sku);
    const spoil = (packs * pack_size) / rate > shelfDays;          // don't order more than it can sell in time
    lines.push({sku_id: sku, supplier_id: pick.s.id, pack_size, min_packs,
                packs: spoil ? Math.max(min_packs, Math.floor(shelfDays * rate / pack_size)) : packs,
                unit_cost: pick.rate, effective_unit_cost: pick.rate, on_hand, est_daily_rate: rate, days_left,
                why: t(alternatives.length ? "why_built" : "why_built1", {n: alternatives.length + 1, r: pick.rate.toFixed(2), h: pick.s.lead_hours || 24, d: COVER_DAYS}),
                alternatives: alternatives.map(a => ({supplier: a.s.name, effective_unit_cost: a.rate}))});
  }
  return lines.sort((a, b) => a.days_left - b.days_left);
}
function cardsFromPriceLists() {
  const cards = {};
  for (const s of DATA.suppliers) {
    const rates = S.pricelists?.[s.id]?.rates || {};
    cards[s.id] = Object.fromEntries(Object.entries(rates).map(([k, v]) => [k, v.rate]));
  }
  return cards;
}
function refreshShopPlan() {            // shops that aren't the example shop plan from their own data
  if (Auth.isExample()) return;
  DATA.cards = cardsFromPriceLists();
  DATA.lines = buildOrderLines();
}

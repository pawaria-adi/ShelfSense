/* ------------------------------------------------------------------ camera barcode scanner
   Uses the phone's built-in barcode reader (BarcodeDetector) when it has one, otherwise
   the ZXing reader (loaded once; the installed app keeps its own copy for offline use). */
const ZXING_URL = window.SHELFSENSE_ZXING_URL || "https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";
const FORMATS = ["ean_13", "ean_8", "upc_a", "upc_e", "code_128", "code_39", "qr_code"];
const normCode = raw => {
  const d = String(raw || "").trim();
  return /^\d{12}$/.test(d) ? "0" + d : d;           // UPC-A read as 12 digits = EAN-13 with a leading 0
};
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; s.async = true; s.onload = res; s.onerror = () => rej(new Error("could not load " + src));
    document.head.appendChild(s);
  });
}
const Camera = {
  stream: null, timer: null, open_: false, last: "", seenAt: 0, readerP: null,
  available() { return !!navigator.mediaDevices?.getUserMedia; },
  async reader() {
    if (this.readerP) return this.readerP;
    this.readerP = (async () => {
      if ("BarcodeDetector" in window) {
        try {
          const have = await BarcodeDetector.getSupportedFormats();
          const formats = FORMATS.filter(f => have.includes(f));
          if (formats.length) {
            const det = new BarcodeDetector({formats});
            return async video => (await det.detect(video)).map(b => b.rawValue);
          }
        } catch (e) { /* fall through to ZXing */ }
      }
      if (!window.ZXing) await loadScript(ZXING_URL);
      const Z = window.ZXing;
      const hints = new Map();
      hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A,
        Z.BarcodeFormat.UPC_E, Z.BarcodeFormat.CODE_128, Z.BarcodeFormat.CODE_39, Z.BarcodeFormat.QR_CODE]);
      hints.set(Z.DecodeHintType.TRY_HARDER, true);
      const zr = new Z.MultiFormatReader();
      zr.setHints(hints);
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d", {willReadFrequently: true});
      return async video => {
        const w = video.videoWidth, h = video.videoHeight;
        if (!w || !h) return [];
        const k = Math.min(1, 800 / w);
        canvas.width = Math.round(w * k); canvas.height = Math.round(h * k);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        try {
          const bmp = new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(canvas)));
          return [zr.decodeWithState(bmp).getText()];
        } catch (e) { return []; }
        finally { zr.reset(); }
      };
    })();
    this.readerP.catch(() => { this.readerP = null; });
    return this.readerP;
  },
  // onCode(code) returns a short line to show under the picture (e.g. the product name)
  async open(title, onCode) {
    const box = $("#cam");
    this.open_ = true; this.last = ""; this.seenAt = 0;
    box.hidden = false;
    document.body.style.overflow = "hidden";
    box.innerHTML = `<div class="cam-head"><strong>${esc(title)}</strong>
        <button type="button" class="iconbtn" id="cam-close" aria-label="${t("close")}">✕</button></div>
      <div class="cam-view"><video id="cam-video" playsinline muted autoplay></video><div class="cam-aim" aria-hidden="true"></div></div>
      <p class="cam-status" id="cam-status" role="status" aria-live="polite">${t("cam_starting")}</p>
      <ul class="cam-log" id="cam-log"></ul>
      <div class="btns cam-foot"><button type="button" class="btn primary" id="cam-done">${t("cam_done")}</button></div>`;
    box.querySelector("#cam-close").onclick = () => this.close();
    box.querySelector("#cam-done").onclick = () => this.close();
    box.onkeydown = e => { if (e.key === "Escape") this.close(); };
    box.querySelector("#cam-done").focus();
    const status = msg => { const s = $("#cam-status"); if (s) s.textContent = msg; };
    if (!this.available()) return status(t("cam_none"));
    let read;
    try {
      [this.stream, read] = await Promise.all([
        navigator.mediaDevices.getUserMedia({audio: false, video: {facingMode: {ideal: "environment"}, width: {ideal: 1280}, height: {ideal: 720}}}),
        this.reader(),
      ]);
    } catch (e) {
      const denied = /NotAllowed|Permission|Security/i.test(e?.name || e?.message || "");
      return status(denied ? t("cam_denied") : t("cam_fail"));
    }
    if (!this.open_) return this.stopStream();
    const video = $("#cam-video");
    video.srcObject = this.stream;
    try { await video.play(); } catch (e) {}
    status(t("cam_aim"));
    const tick = async () => {
      if (!this.open_) return;
      let codes = [];
      try { if (video.readyState >= 2) codes = await read(video); } catch (e) {}
      for (const raw of codes) {
        const code = normCode(raw);
        const now = Date.now();
        if (!code) continue;
        const same = code === this.last && now - this.seenAt < 1200;   // still the same item in view
        this.seenAt = now;
        if (same) continue;
        this.last = code;
        navigator.vibrate?.(60);
        const line = onCode(code);
        const log = $("#cam-log");
        if (log && line) {
          log.insertAdjacentHTML("afterbegin", `<li>${esc(line)}</li>`);
          while (log.children.length > 4) log.lastElementChild.remove();
        }
        status(line || code);
      }
      this.timer = setTimeout(tick, 180);
    };
    tick();
  },
  stopStream() {
    this.stream?.getTracks().forEach(tr => tr.stop());
    this.stream = null;
  },
  close() {
    if (!this.open_) return;
    this.open_ = false;
    clearTimeout(this.timer);
    this.stopStream();
    const box = $("#cam");
    box.hidden = true; box.innerHTML = "";
    document.body.style.overflow = "";
    render();
  },
};

  aria-label="${t("cam_btn")}"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v8M16 8v8"/></svg><span>${t("cam_btn")}</span></button>`;

/* ------------------------------------------------------------------ sales rate from this shop's own records */
let rateCache = {key: "", rates: {}};
function rateOf(sku) {
  if (DATA.rates[sku]) return DATA.rates[sku];
  const days = Object.keys(S.scans).sort();
  const key = days.length + ":" + days.map(d => S.scans[d].ops?.length || 0).join(",");
  if (rateCache.key !== key) {
    const recent = days.slice(-30);
    const span = recent.length ? Math.max(1, Math.min(30, daysBetween(recent[0], todayISO()) + 1)) : 1;
    const tot = {};

/* ------------------------------------------------------------------ Paytm payments -> likely bill
   A payment says how much was paid, not what was bought. We list the item combinations
   (1–3 items) that add up to the amount and rank them by how well each item sells, the
   time of day, and whether it is on the shelf. The shopkeeper confirms, edits or ignores. */
const HOUR_LIFT = {
  Dairy: [1.9, 0.7, 0.9], Staples: [1.4, 1.0, 0.8], Beverages: [0.8, 1.2, 1.4], Snacks: [0.6, 1.1, 1.7],
  Confection: [0.6, 1.1, 1.6], Biscuits: [1.1, 1.2, 1.2], Noodles: [0.7, 1.2, 1.4], "Home Care": [1.0, 1.1, 0.9],
  Oil: [1.2, 1.0, 0.9], Spices: [1.1, 1.0, 0.9], Spreads: [1.2, 0.9, 0.9],
};
const SIZE_PRIOR = [0, 1, 0.34, 0.11];
function guessBasket(amount, hour, top = 3) {
  const target = Math.round(Number(amount) * 100);
  if (!(target > 0)) return [];
  const band = hour >= 6 && hour < 12 ? 0 : hour >= 12 && hour < 16 ? 1 : 2;
  const tracked = S.stock && Object.values(S.stock.counts || {}).some(n => n > 0);
  const items = DATA.catalogue.filter(c => c.price > 0 && (!tracked || (S.stock.counts[c.sku_id] || 0) > 0));
  const w = {};
  for (const c of items) w[c.sku_id] = (rateOf(c.sku_id) + 0.3) * (HOUR_LIFT[c.category]?.[band] ?? 1);
  const byPrice = new Map();
  for (const c of items) { const p = Math.round(c.price * 100); if (!byPrice.has(p)) byPrice.set(p, []); byPrice.get(p).push(c); }
  const prices = [...byPrice.keys()].sort((a, b) => a - b);
  const out = [];
  const push = basket => out.push({basket, score: SIZE_PRIOR[basket.length] * basket.reduce((a, c) => a * w[c.sku_id], 1)});
  for (const c of byPrice.get(target) || []) push([c]);
  for (let i = 0; i < prices.length; i++) {
    const p1 = prices[i];
    if (p1 * 2 > target) break;
    for (const c1 of byPrice.get(p1)) for (const c2 of byPrice.get(target - p1) || [])
      if (p1 < target - p1 || c1.sku_id <= c2.sku_id) push([c1, c2]);
    for (let j = i; j < prices.length; j++) {
      const p2 = prices[j], p3 = target - p1 - p2;
      if (p3 < p2) break;
      for (const c3 of byPrice.get(p3) || []) for (const c2 of byPrice.get(p2)) for (const c1 of byPrice.get(p1)) {
        if ((p1 === p2 && c2.sku_id < c1.sku_id) || (p2 === p3 && c3.sku_id < c2.sku_id)) continue;
        push([c1, c2, c3]);
      }
      if (out.length > 4000) break;
    }
  }
  const total = out.reduce((a, x) => a + x.score, 0) || 1;
  return out.sort((a, b) => b.score - a.score).slice(0, top).map(x => {
    const units = {};
    for (const c of x.basket) units[c.sku_id] = (units[c.sku_id] || 0) + 1;
    return {units, conf: x.score / total};
  });
}

const b64 = u8 => btoa(String.fromCharCode(...u8));
const unb64 = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));
const rid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
async function hashPin(pin, salt) {
  const saltBytes = salt ? unb64(salt) : crypto.getRandomValues(new Uint8Array(16));
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({name: "PBKDF2", hash: "SHA-256", salt: saltBytes, iterations: 150000}, key, 256);
  return {salt: b64(saltBytes), hash: b64(new Uint8Array(bits))};
}
const validPin = p => /^\d{4,6}$/.test(p);
const validMobile = m => /^\d{10}$/.test(m);
const cleanMobile = v => {                      // "+91 98765 43210" / "098765 43210" -> "9876543210"
  let d = String(v).replace(/\D/g, "");
  if (d.length > 10 && d.startsWith("91")) d = d.slice(2);
  if (d.length > 10 && d.startsWith("0")) d = d.slice(1);
  return d.slice(0, 10);
};
const showMobile = m => m ? `+91 ${m.slice(0, 5)} ${m.slice(5)}` : "";
const ADMIN = DATA.admin;                        // example-data account: mobile + PIN hash only
const isAdminMobile = m => m === ADMIN.mobile;

const LocalAuth = {
  KEY: "shelfsense-accounts", SKEY: "shelfsense-session", GUARD: "shelfsense-admin-guard",
  data() {
    const d = lsGet(this.KEY, null);
    if (!d) return {v: 2, shops: {}, users: []};
    if (d.v !== 2) {                             // older one-shop format: keep the shop, drop users without a mobile
      const shops = d.shop ? {[d.shop.id]: {...d.shop, example: false}} : {};
      return {v: 2, shops, users: (d.users || []).filter(u => u.mobile).map(u => ({...u, shopId: d.shop.id}))};
    }
    return d;
  },
  save(d) { lsSet(this.KEY, d); },
  byMobile(m) { return this.data().users.find(u => u.mobile === m); },
  async makeUser(shopId, name, mobile, pin, role) {
    const {salt, hash} = await hashPin(pin);
    return {id: "u-" + rid(), shopId, name: name.trim(), mobile, role, salt, hash, len: pin.length,
            fails: 0, waitUntil: 0, created: new Date().toISOString()};
  },
  async signUp({shopName, name, mobile, pin}) {
    const d = this.data();

    d.shops[shopId] = {id: shopId, name: shopName.trim(), created: new Date().toISOString(), example: false};
    const owner = await this.makeUser(shopId, name, mobile, pin, "owner");
    d.users.push(owner);
    this.save(d);
    return owner;
  },
  async setSecurity(userId, q, answer) {
    const d = this.data();
    const u = d.users.find(x => x.id === userId);

    this.save(d);
  },
  setName(userId, name) {

  },
  question(mobile) { return this.byMobile(mobile)?.sec?.q || null; },
  async resetPin(mobile, answer, pin) {
    const d = this.data();

    const {hash} = await hashPin(cleanAnswer(answer), u.sec.salt);
    if (hash !== u.sec.hash) return {ok: false, reason: "wrong"};
    Object.assign(u, await hashPin(pin), {len: pin.length, fails: 0, waitUntil: 0});

  },
  lockout(rec) {
    rec.fails = (rec.fails || 0) + 1;
    if (rec.fails >= 5) rec.waitUntil = Date.now() + 30000 * 2 ** Math.min(4, rec.fails - 5);
    return rec.waitUntil > Date.now()
      ? {ok: false, reason: "wait", secs: Math.ceil((rec.waitUntil - Date.now()) / 1000)}
      : {ok: false, reason: "wrong", left: 5 - rec.fails};
  },
  async logIn(mobile, pin) {
    if (isAdminMobile(mobile)) {
      const g = lsGet(this.GUARD, {fails: 0, waitUntil: 0});
      if (g.waitUntil > Date.now()) return {ok: false, reason: "wait", secs: Math.ceil((g.waitUntil - Date.now()) / 1000)};
      const {hash} = await hashPin(pin, ADMIN.salt);
      if (hash !== ADMIN.hash) { const r = this.lockout(g); lsSet(this.GUARD, g); return r; }
      lsSet(this.GUARD, {fails: 0, waitUntil: 0});

      this.save(d);

    }
    const d = this.data();
    const u = d.users.find(x => x.mobile === mobile);
    if (!u) return {ok: false, reason: "nouser"};
    if (u.waitUntil > Date.now()) return {ok: false, reason: "wait", secs: Math.ceil((u.waitUntil - Date.now()) / 1000)};
    const {hash} = await hashPin(pin, u.salt);
    if (hash === u.hash) { u.fails = 0; u.waitUntil = 0; this.save(d); return {ok: true, user: u}; }

  },
  async addUser(shopId, name, mobile, pin) {

  },
  team(shopId) { return this.data().users.filter(u => u.shopId === shopId); },
  removeUser(id) {

    this.save(d);
  },
  async setPin(id, pin) {
    const d = this.data();
    const u = d.users.find(x => x.id === id);
    if (!u) throw {message: t("admin_pin_fixed")};
    Object.assign(u, await hashPin(pin), {len: pin.length, fails: 0, waitUntil: 0});
    this.save(d);
  },
  renameShop(shopId, name) { const d = this.data(); d.shops[shopId].name = name.trim(); this.save(d); },
};

      : d.users.find(x => x.id === sess.userId);

function wireLogin(box) {
  box.querySelector("#a-theme").onclick = () => setPref("theme", isDark() ? "light" : "dark");
  box.querySelectorAll(".auth-top .lang button").forEach(b => b.onclick = () => setLang(b.dataset.lang));
  const val = id => (box.querySelector("#" + id)?.value || "").trim();
  const fail = msg => { L.err = msg; L.busy = false; drawLogin(); };
  const done = async () => { L.busy = false; L.err = ""; L.info = ""; await startApp(); };
  const go = step => () => { L.step = step; L.err = ""; L.info = ""; drawLogin(); };
  box.querySelector("#go-signup")?.addEventListener("click", go("signup"));
  box.querySelector("#go-login")?.addEventListener("click", go("login"));
  box.querySelector("#m-new")?.addEventListener("click", () => { L.mode = "new"; L.err = ""; drawLogin(); });
  box.querySelector("#m-join")?.addEventListener("click", () => { L.mode = "join"; L.err = ""; drawLogin(); });

  // ---- log in: mobile + PIN
  box.querySelector("#f-login")?.addEventListener("submit", async e => {
    e.preventDefault();
    const mobile = cleanMobile(val("l-mobile")), pin = box.querySelector("#l-pin").value;
    if (!validMobile(mobile)) return fail(t("mobile_bad"));
    if (!validPin(pin)) return fail(t("pin_short"));
    L.busy = true; drawLogin();
    if (!Cloud) {
      const r = await LocalAuth.logIn(mobile, pin);
      if (!r.ok) return fail(r.reason === "wait" ? t("pin_wait", {s: r.secs}) : r.reason === "nouser" ? t("no_account") : t("pin_wrong", {n: r.left}));
      Auth.setLocal(r.user);
      return done();
    }
    try { await Cloud.signInMobile(mobile, pin); }
    catch (err) {
      if (err.code === "offline") return fail(t("offline_login"));
      // the example account is created in the cloud the first time it is used
      if (isAdminMobile(mobile) && (await hashPin(pin, ADMIN.salt)).hash === ADMIN.hash) {
        try { await Cloud.signUpMobile("Admin", mobile, pin); await Cloud.signInMobile(mobile, pin); }
        catch (err2) { return fail(err2.message); }
      } else return fail(err.status === 400 ? t("login_bad") : err.message);
    }
    const r = await Auth.restore();
    if (r === "shop") {
      if (isAdminMobile(mobile)) {
        const shops = await Cloud.myShops().catch(() => []);
        if (shops.length) Cloud.useShop(shops[0]);
        else { try { await Cloud.createShop(DATA.example_shop_name); } catch (err) { return fail(err.message); } }
        await Auth.restore();
        return done();
      }
      return pickShopStep();
    }
    done();
  });

  // ---- sign up: new shop (or join one, in the cloud)
  box.querySelector("#f-signup")?.addEventListener("submit", async e => {
    e.preventDefault();
    const join = Cloud && L.mode === "join";
    const shopName = val("s-shop"), code = val("s-code").toUpperCase();
    const mobile = cleanMobile(val("s-mobile")), pin = box.querySelector("#s-pin").value, pin2 = box.querySelector("#s-pin2").value;
    const name = join ? showMobile(mobile) : shopName;              // replaced on the details page
    if (join ? code.length !== 6 : !shopName) return fail(t("need_field", {f: join ? t("f_code") : t("f_shop")}));
    if (!validMobile(mobile)) return fail(t("mobile_bad"));
    if (isAdminMobile(mobile)) return fail(t("mobile_taken"));
    if (!validPin(pin)) return fail(t("pin_short"));
    if (pin !== pin2) return fail(t("pin_mismatch"));
    L.busy = true; drawLogin();
    if (!Cloud) {
      if (LocalAuth.byMobile(mobile)) return fail(t("mobile_taken"));
      const owner = await LocalAuth.signUp({shopName, name, mobile, pin});
      Auth.setLocal(owner);
      L.busy = false;
      return showLogin("details");
    }
    try {
      const r = await Cloud.signUpMobile(name, mobile, pin);
      if (!r.signedIn) { L.busy = false; L.step = "login"; L.info = t("confirm_later"); return drawLogin(); }
    } catch (err) {
      if (err.code === "offline") return fail(t("offline_signup"));
      return fail(/registered|exists/i.test(err.message) ? t("mobile_taken") : err.message);
    }
    try { if (join) await Cloud.joinShop(code); else await Cloud.createShop(shopName); }
    catch (err) {                 // the account exists now: continue on the shop step
      await Auth.restore();
      await pickShopStep();
      L.err = shopError(err); return drawLogin();
    }
    await Auth.restore();
    L.busy = false;
    if (Auth.shop) return showLogin("details");
    done();
  });

  // ---- details of the shopkeeper and the shop (sign-up step 2)
  box.querySelector("#f-details")?.addEventListener("submit", async e => {
    e.preventDefault();
    const name = val("d-name"), city = val("d-city"), pincode = val("d-pin").replace(/\D/g, "").slice(0, 6);
    const address = val("d-addr"), q = box.querySelector("#d-q")?.value, answer = val("d-a");
    if (!name) return fail(t("need_field", {f: t("f_yourname")}));
    if (!city && !pincode) return fail(t("need_field", {f: t("f_city")}));
    if (Auth.kind === "local" && cleanAnswer(answer).length < 2) return fail(t("sec_needed"));
    L.busy = true; drawLogin();
    if (Auth.kind === "local") {
      LocalAuth.setName(Auth.user.id, name);
      await LocalAuth.setSecurity(Auth.user.id, q, answer);
      Auth.user.name = name;
    } else {
      try { await Cloud.setName(name); Auth.user.name = name; } catch (err) { return fail(err.message); }
    }
    L.details = {city, pincode, address, owner_name: name, at: new Date().toISOString()};
    done();
  });
  box.querySelector("#d-skip")?.addEventListener("click", () => done());

  // ---- forgot the PIN: answer the security question and set a new one
  box.querySelector("#f-forgot")?.addEventListener("submit", async e => {
    e.preventDefault();
    const mobile = cleanMobile(val("fg-mobile"));
    if (!validMobile(mobile)) return fail(t("mobile_bad"));
    const q = LocalAuth.question(mobile);
    if (!q) return fail(t("forgot_noq"));
    L.fgMobile = mobile; L.fgQ = q; L.err = ""; drawLogin();
  });
  box.querySelector("#f-reset")?.addEventListener("submit", async e => {
    e.preventDefault();
    const answer = val("fg-a"), pin = box.querySelector("#fg-pin").value;
    if (!validPin(pin)) return fail(t("pin_short"));
    L.busy = true; drawLogin();
    const r = await LocalAuth.resetPin(L.fgMobile, answer, pin);
    L.busy = false;
    if (!r.ok) return fail(r.reason === "noq" ? t("forgot_noq") : t("forgot_wrong"));
    L.fgMobile = null; L.fgQ = null; L.step = "login"; L.info = t("pin_reset_ok"); L.err = "";
    drawLogin();
  });

  // ---- unlock (PIN pad for the person who was using the app)
  const pad = box.querySelector(".pinpad");
  if (pad) {
    const len = Auth.user?.len || 4;
    const submit = async () => {
      if (L.pin.length < 4) return;
      L.busy = true; drawLogin();
      const r = await LocalAuth.logIn(Auth.user.mobile, L.pin);
      L.pin = ""; L.busy = false;
      if (r.ok && r.user.id === Auth.user.id) { Auth.setLocal(r.user); return done(); }
      L.err = r.reason === "wait" ? t("pin_wait", {s: r.secs}) : t("pin_wrong", {n: r.left ?? 0});
      drawLogin();
      box.querySelector(".pindots")?.classList.add("shake");
    };
    const press = k => {
      if (L.busy) return;
      if (k === "del") L.pin = L.pin.slice(0, -1);
      else if (k === "ok") return submit();
      else if (L.pin.length < 6) L.pin += k;
      L.err = "";
      if (L.pin.length === len) return submit();
      drawLogin();
    };
    pad.querySelectorAll("button").forEach(b => b.onclick = () => press(b.dataset.k));
    box.onkeydown = e => {
      if (/^\d$/.test(e.key)) press(e.key);
      else if (e.key === "Backspace") press("del");
      else if (e.key === "Enter") press("ok");
    };
    pad.querySelector("button")?.focus({preventScroll: true});
  } else box.onkeydown = null;
  box.querySelector("#switch")?.addEventListener("click", () => {
    try { localStorage.removeItem(LocalAuth.SKEY); } catch (e) {}
    location.reload();
  });
  box.querySelector("#forgot")?.addEventListener("click", () => { L.prev = L.step; L.step = "forgot"; L.fgQ = null; L.fgMobile = null; L.err = ""; drawLogin(); });
  box.querySelector("#back")?.addEventListener("click", () => {
    if (L.fgQ) { L.fgQ = null; L.fgMobile = null; L.err = ""; return drawLogin(); }
    L.step = L.prev || "login"; L.confirmClear = false; drawLogin();
  });
  box.querySelector("#clear")?.addEventListener("click", () => {
    if (!L.confirmClear) { L.confirmClear = true; return drawLogin(); }
    clearPhone();
  });

  // ---- cloud: choose / create / join a shop
  box.querySelector("#f-new")?.addEventListener("submit", async e => {
    e.preventDefault();
    const name = val("n-shop");
    if (!name) return fail(t("need_field", {f: t("f_shop")}));
    L.busy = true; drawLogin();
    try { await Cloud.createShop(name); } catch (err) { return fail(err.message); }
    await Auth.restore(); L.busy = false; showLogin("details");
  });
  box.querySelector("#f-join")?.addEventListener("submit", async e => {
    e.preventDefault();
    const code = val("j-code").toUpperCase();
    if (code.length !== 6) return fail(t("need_field", {f: t("f_code")}));
    L.busy = true; drawLogin();
    try { await Cloud.joinShop(code); } catch (err) { return fail(shopError(err)); }
    await Auth.restore(); L.busy = false; showLogin("details");
  });
  box.querySelector("#out")?.addEventListener("click", () => Auth.signOut());
  if (L.step === "shop" && L.shops) {
    const list = box.querySelector("#shoplist");
    list.innerHTML = L.shops.map((s, i) => `<button type="button" class="userbtn row-btn" data-i="${i}">
      <span class="avatar">${esc(s.name[0] || "?").toUpperCase()}</span>
      <span class="grow">${esc(s.name)}<small>${t("role_" + s.role)}</small></span><span>${t("pick_shop")} ›</span></button>`).join("");
    list.querySelectorAll("button").forEach(b => b.onclick = async () => {
      Cloud.useShop(L.shops[Number(b.dataset.i)]);
      await Auth.restore(); done();
    });
  }
}
const shopError = err => /no shop/i.test(err.message || "") ? t("code_bad") : err.message;
async function pickShopStep() {
  L.busy = false; L.err = "";
  try { L.shops = await Cloud.myShops(); } catch (e) { L.shops = []; L.err = e.message; }
  if (L.shops.length === 1) { Cloud.useShop(L.shops[0]); await Auth.restore(); return startApp(); }
  showLogin("shop");
}
function clearPhone() {
  try { Object.keys(localStorage).filter(k => k.startsWith("shelfsense")).forEach(k => localStorage.removeItem(k)); } catch (e) {}
  try { indexedDB.deleteDatabase("shelfsense-bills"); } catch (e) {}
  location.reload();
}

            <button class="btn small" type="submit">${t("save")}</button></form>` : `<span>${esc(shopName)}</span>`}</div>
        ${!local ? `<div class="set-row"><span class="lbl">${t("join_code")}<small>${t("join_code_p")}</small></span>

          <a class="btn small wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(t("invite_msg", {s: shopName, u: inviteUrl, c: Auth.shop?.code || ""}))}">${t("invite_wa")}</a>
          ${owner ? `<button type="button" class="btn small" id="new-code">${t("new_code")}</button>` : ""}</span></div>` : ""}
        ${teamRows}
        ${ST.msg.team ? `<div class="set-row"><small class="err">${esc(ST.msg.team)}</small></div>` : ""}
        ${local && owner && !Auth.isExample() ? `<div class="set-row">${ST.addOpen ? `<form class="inlineform wide" id="add-staff" novalidate>
            <input class="text" id="add-name" maxlength="40" placeholder="${t("f_name")}" aria-label="${t("f_name")}">
            <span class="phone"><span class="cc" aria-hidden="true">+91</span><input class="text" id="add-mobile" type="tel" inputmode="numeric" data-mobile maxlength="14" placeholder="${t("mobile_ph")}" aria-label="${t("f_mobile")} (+91)"></span>
            <input class="text" id="add-pin" type="password" inputmode="numeric" data-pin maxlength="6" placeholder="${t("f_pin")}" aria-label="${t("f_pin")}">
            <button class="btn small primary" type="submit">${t("add_staff")}</button></form>`
          : `<button type="button" class="btn small" id="open-add">+ ${t("add_staff")}${lockTag()}</button>`}
          ${ST.msg.add ? `<small class="full err">${esc(ST.msg.add)}</small>` : ""}</div>` : ""}
        ${!owner ? `<div class="set-row"><small class="muted">${t("owner_only")}</small></div>` : ""}
      </div></section>

      <section class="set-group"><h3>${t("s_shop")}</h3><div class="set-card">
        ${!d.city && !d.pincode && owner ? `<div class="set-row"><small class="note full">${t("loc_missing")}</small></div>` : ""}
        ${row(t("f_city"), owner ? `<form class="inlineform" id="loc-form" novalidate>
            <input class="text" id="loc-city" value="${esc(d.city || "")}" maxlength="60" placeholder="${t("f_city")}" aria-label="${t("f_city")}">
            <input class="text" id="loc-pin" value="${esc(d.pincode || "")}" inputmode="numeric" maxlength="6" placeholder="${t("f_pincode")}" aria-label="${t("f_pincode")}">
            <button class="btn small" type="submit">${t("save")}</button></form>`
          : `<span>${esc([d.city, d.pincode].filter(Boolean).join(" · ") || "—")}</span>`)}
        ${row(t("f_street"), owner ? `<form class="inlineform wide" id="addr-form" novalidate>
            <input class="text" id="loc-addr" value="${esc(d.address || "")}" maxlength="120" aria-label="${t("f_street")}">
            <button class="btn small" type="submit">${t("save")}</button></form>` : `<span>${esc(d.address || "—")}</span>`)}
        ${ST.msg.loc ? `<div class="set-row"><small class="${ST.msg.locOk ? "okline" : "err"}">${esc(ST.msg.loc)}</small></div>` : ""}
      </div></section>

      <section class="set-group"><h3>${t("s_supp")}</h3><div class="set-card">
        ${DATA.suppliers.map(sp => {
          const st2 = supplierStats(sp.id);
          return `<div class="set-row"><span class="lbl">${esc(sp.name)}
            <small>${[sp.phone ? esc(showMobile(String(sp.phone).replace(/\D/g, "").slice(-10))) : "", esc(sp.address || "")].filter(Boolean).join(" · ")}</small>
            <small class="num">${st2.items ? t("pl_stats", {n: st2.items, b: st2.best, d: st2.at ? fmtDate(st2.at.slice(0, 10)) : "—"}) : t("pl_missing")}
            ${st2.deliveries ? " · " + t("pl_deliv", {n: st2.deliveries, p: st2.onTime ?? 100}) : ""}</small></span>
            <span class="btns">
              <button type="button" class="btn small" data-pl="${sp.id}" ${S.sample && S.imagesOK && S.canWrite ? "" : "disabled"}>${t("pl_add")}${lockTag()}</button>
              ${S.suppliers?.[sp.id] && owner ? `<button type="button" class="btn small danger" data-supdel="${sp.id}">${t("btn_remove")}</button>` : ""}
            </span></div>`;
        }).join("")}
        ${owner ? `<div class="set-row"><span class="btns">
          ${HOSTED ? `<button type="button" class="btn small primary" id="find-wh" ${S.canWrite ? "" : "disabled"}>${ST.finding ? t("wh_finding") : t("wh_find") + lockTag()}</button>` : ""}
          <button type="button" class="btn small ${HOSTED ? "" : "primary"}" id="add-wh">+ ${t("wh_add")}</button></span>
          <small class="full note">${!HOSTED ? t("wh_here") : HAS_PLACES ? t("wh_p_mappls") : t("wh_p")}</small>
          ${!d.city && !d.pincode ? `<small class="full note">${t("wh_addloc")}</small>` : ""}</div>` : ""}
        ${ST.whAdd ? `<div class="set-row"><form class="stack full" id="wh-form" novalidate>
            <label class="field"><span>${t("f_wname")}</span><input class="text" id="wh-name" maxlength="60" value="${esc(ST.whDraft?.name || "")}"></label>
            <label class="field"><span>${t("f_mobile")}</span><span class="phone"><span class="cc" aria-hidden="true">+91</span>
              <input class="text" id="wh-phone" type="tel" inputmode="numeric" data-mobile maxlength="14" placeholder="${t("mobile_ph")}" value="${esc(ST.whDraft?.phone || "")}"></span></label>
            <label class="field"><span>${t("f_street")}</span><input class="text" id="wh-addr" maxlength="120" value="${esc(ST.whDraft?.address || d.city || "")}"></label>
            <div class="pick-row">
              <label class="field"><span>${t("wh_lead")}</span><input class="text" id="wh-lead" type="number" min="1" max="168" value="24"></label>
              <label class="field"><span>${t("wh_credit")}</span><input class="text" id="wh-credit" type="number" min="0" max="60" value="0"></label>
            </div>
            <div class="btns"><button class="btn small primary" type="submit">${t("wh_add")}</button>
              <button type="button" class="btn small" id="wh-cancel">${t("cancel")}</button></div></form></div>` : ""}
        ${ST.msg.wh ? `<div class="set-row"><small class="err">${esc(ST.msg.wh)}</small></div>` : ""}
        ${(ST.found || []).length ? `<div class="set-row"><span class="lbl">${t("wh_found", {n: ST.found.length})}<small>${HAS_PLACES ? t("mappls_credit") : t("osm_credit")}</small></span>
          <div class="picks full">${ST.found.map((w, i) => `<button type="button" class="pick" data-wh="${i}">
            <span><strong>${esc(w.name)}</strong><small>${esc([w.km ? w.km + " km" : "", w.address, w.phone].filter(Boolean).join(" · "))}</small></span>
            <span class="add">+</span></button>`).join("")}</div></div>` : ""}
      </div></section>

      <section class="set-group"><h3>${t("s_data")}</h3><div class="set-card">
        ${row(S.store === "db" ? (n ? t("waiting_n", {n}) : t("all_synced")) : t("storage_local"),
              S.store === "db" ? `<button type="button" class="btn small" id="sync-now" ${n && navigator.onLine ? "" : "disabled"}>${t("sync_now")}</button>` : "",
              S.store === "db" ? (S.lastSync ? t("last_sync", {t: new Date(S.lastSync).toLocaleTimeString(lang === "hi" ? "hi-IN" : "en-IN", {hour: "numeric", minute: "2-digit"})}) : t("storage_cloud")) : "")}
        ${S.downloads ? row(t("export"), `<button type="button" class="btn small" id="s-export">${t("export")}${lockTag()}</button>`, t("export_p")) : ""}
        ${owner || local ? row(t("clear_phone"), `<button type="button" class="btn small danger" id="s-clear">${ST.confirmClear ? t("tap_again") : t("clear_phone")}</button>`, t("clear_p")) : ""}
      </div></section>

      <section class="set-group"><h3>${t("s_about")}</h3><div class="set-card">
        ${row("ShelfSense", `<small class="muted">${esc(DATA.version || "")}</small>`, t("about_p"))}
        ${OFF.length ? row(t("off_about"), "", t("off_credit")) : ""}
        ${Auth.kind === "cloud" && owner ? row(t("shop_id"), `<code class="code small-code">${esc(Auth.shop?.id || "")}</code>`, t("shop_id_p")) : ""}
      </div></section>

  wireSettings(box);
}
function wireSettings(box) {
  box.querySelector("#close-settings").onclick = closeSettings;
  box.onkeydown = e => { if (e.key === "Escape") closeSettings(); };
  box.querySelector("#go-plans")?.addEventListener("click", () => { ST.lock = null; openPlans(); });
  box.querySelectorAll("[data-pref]").forEach(b => b.onclick = () => {
    const k = b.dataset.pref, v = b.dataset.v;
    setPref(k, typeof Prefs[k] === "number" ? Number(v) : v);
  });
  box.querySelectorAll("[data-switch]").forEach(b => b.onclick = () => setPref(b.dataset.switch, !Prefs[b.dataset.switch]));
  box.querySelectorAll(".seg [data-lang]").forEach(b => b.onclick = () => setLang(b.dataset.lang));
  box.querySelector("#lock-now")?.addEventListener("click", () => Auth.lock());
  box.querySelector("#sign-out").onclick = () => {
    if (!ST.confirmOut) { ST.confirmOut = true; return drawSettings(); }
    Auth.signOut();
  };
  const mySecret = box.querySelector("#my-secret");
  if (mySecret) mySecret.onsubmit = async e => {
    e.preventDefault();
    const v = box.querySelector("#my-secret-in").value;
    ST.msg.secretOk = false;
    try {
      if (!validPin(v)) throw {message: t("pin_short")};
      if (Auth.kind === "local") await LocalAuth.setPin(Auth.user.id, v);
      else await Cloud.changePin(v);
      if (Auth.user) Auth.user.len = v.length;
      ST.msg.secret = t("pin_saved");
      ST.msg.secretOk = true;
    } catch (err) { ST.msg.secret = err.message; }
    drawSettings();
  };
  box.querySelector("#shop-name")?.addEventListener("submit", async e => {
    e.preventDefault();
    const v = box.querySelector("#shop-name-in").value.trim();
    if (!v) return;
    try {
      if (Auth.kind === "local") LocalAuth.renameShop(Auth.shop.id, v);
      else { await Cloud.renameShop(Auth.shop.id, v); Cloud.useShop({...Auth.shop, name: v}); }
      Auth.shop.name = v;
      toast(t("saved"));
    } catch (err) { toast(err.message); }
    drawSettings();
  });
  box.querySelector("#new-code")?.addEventListener("click", async () => {
    try { const c = await Cloud.newCode(Auth.shop.id); Auth.shop.code = c; Cloud.useShop(Auth.shop); drawSettings(); }
    catch (err) { toast(err.message); }
  });
  box.querySelector("#open-add")?.addEventListener("click", () => { if (!isPlus()) return openLock("team"); ST.addOpen = true; ST.msg.add = ""; drawSettings(); box.querySelector("#add-name")?.focus(); });
  box.querySelector("#add-staff")?.addEventListener("submit", async e => {
    e.preventDefault();
    const name = box.querySelector("#add-name").value.trim(), pin = box.querySelector("#add-pin").value;
    const mobile = cleanMobile(box.querySelector("#add-mobile").value);
    const bad = !name ? t("need_field", {f: t("f_name")}) : !validMobile(mobile) ? t("mobile_bad")
      : isAdminMobile(mobile) || LocalAuth.byMobile(mobile) ? t("mobile_used") : !validPin(pin) ? t("pin_short") : "";
    if (bad) {
      ST.msg.add = bad; drawSettings();
      box.querySelector("#add-name").value = name; box.querySelector("#add-mobile").value = mobile;
      return;
    }
    await LocalAuth.addUser(Auth.shop.id, name, mobile, pin);
    ST.addOpen = false; ST.msg.add = "";
    toast(t("staff_added", {n: name}));
    loadTeam();
  });
  box.querySelectorAll("[data-setpin]").forEach(b => b.onclick = () => { ST.pinFor = b.dataset.setpin; drawSettings(); });
  box.querySelectorAll("[data-pinform]").forEach(f => f.onsubmit = async e => {
    e.preventDefault();
    const pin = f.querySelector("input").value;
    if (!validPin(pin)) return toast(t("pin_short"));
    try { await LocalAuth.setPin(f.dataset.pinform, pin); } catch (err) { return toast(err.message); }
    ST.pinFor = null; toast(t("pin_saved")); drawSettings();
  });
  box.querySelectorAll("[data-remove]").forEach(b => b.onclick = async () => {
    const id = b.dataset.remove;
    if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = t("tap_again"); return; }
    try {
      if (Auth.kind === "local") LocalAuth.removeUser(id);
      else await Cloud.removeMember(Auth.shop.id, id);
    } catch (err) { toast(err.message); }
    loadTeam();
  });
  const saveDetails = async (details, look) => {
    ST.msg.loc = ""; ST.msg.locOk = false;
    commit("shop_details", {details});
    if (look && (details.pincode || details.city)) {
      ST.msg.loc = t("loc_looking"); drawSettings();
      try {
        const g = await geocode([details.address, details.city, details.pincode, "India"].filter(Boolean).join(", "));
        commit("shop_details", {details: {lat: g.lat, lon: g.lon, place: g.label}});
        ST.msg.loc = t("loc_ok", {p: g.label.split(",").slice(0, 3).join(",")}); ST.msg.locOk = true;
      } catch (e) {
        if (e?.code === "blocked") { ST.msg.loc = t("loc_saved"); ST.msg.locOk = true; }
        else ST.msg.loc = e.message || t("net_bad");
      }
    }
    drawSettings();
  };
  box.querySelector("#loc-form")?.addEventListener("submit", e => {
    e.preventDefault();
    saveDetails({city: box.querySelector("#loc-city").value.trim(), pincode: box.querySelector("#loc-pin").value.replace(/\D/g, "").slice(0, 6)}, true);
  });
  box.querySelector("#addr-form")?.addEventListener("submit", e => {
    e.preventDefault();
    saveDetails({address: box.querySelector("#loc-addr").value.trim()}, true);
  });
  box.querySelector("#find-wh")?.addEventListener("click", async () => {
    if (!isPlus()) return openLock("wh");
    const det = S.shop_details || {};
    ST.msg.wh = ""; ST.found = [];
    if (!det.lat && !(det.pincode || det.city)) { ST.msg.wh = t("wh_needloc"); return drawSettings(); }
    ST.finding = true; drawSettings();
    try {
      if (HAS_PLACES) {                               // Mappls: names, addresses, phone numbers
        const place = [det.address, det.city, det.pincode, "India"].filter(Boolean).join(", ");
        const ask = {place, refLocation: det.lat ? `${det.lat},${det.lon}` : "", radius: 5000};
        const out = PLACES ? await placesNearby(ask) : await mapplsNearby(ask);
        ST.found = out.list;
        if (out.place && !det.place) commit("shop_details", {details: {place: out.place}});
      } else {
        let {lat, lon} = det;
        if (!lat) {
          const g = await geocode([det.address, det.city, det.pincode, "India"].filter(Boolean).join(", "));
          lat = g.lat; lon = g.lon;
          commit("shop_details", {details: {lat, lon, place: g.label}});
        }
        ST.found = await nearbyWholesalers(lat, lon);
      }
      if (!ST.found.length) ST.msg.wh = t("wh_nothing");
    } catch (e) { ST.msg.wh = e.message || t("net_bad"); }
    ST.finding = false; drawSettings();
  });
  box.querySelector("#add-wh")?.addEventListener("click", () => { ST.whAdd = !ST.whAdd; drawSettings(); });
  box.querySelector("#wh-cancel")?.addEventListener("click", () => { ST.whAdd = false; ST.whDraft = null; ST.msg.wh = ""; drawSettings(); });
  box.querySelector("#wh-form")?.addEventListener("submit", e => {
    e.preventDefault();
    const name = box.querySelector("#wh-name").value.trim();
    const draft = {name, phone: box.querySelector("#wh-phone").value.replace(/\D/g, ""), address: box.querySelector("#wh-addr").value.trim(),
                   lead_hours: Math.max(1, Number(box.querySelector("#wh-lead").value) || 24),
                   credit_days: Math.max(0, Number(box.querySelector("#wh-credit").value) || 0), source: "manual"};
    if (!name) { ST.msg.wh = t("need_field", {f: t("f_wname")}); ST.whDraft = draft; return drawSettings(); }
    const rec = addSupplier(draft);
    ST.msg.wh = rec ? "" : t("wh_failed");
    ST.whAdd = !rec; ST.whDraft = rec ? null : draft;
    drawSettings();
  });
  box.querySelectorAll("[data-wh]").forEach(b => b.onclick = () => {
    const w = ST.found[Number(b.dataset.wh)];
    const rec = addSupplier({name: w.name, phone: String(w.phone || "").replace(/\D/g, ""), address: w.address, osm: w.osm || w.eloc || null,
                 source: w.source || "openstreetmap"});
    if (rec) ST.found = ST.found.filter(x => x !== w);
    else ST.msg.wh = t("wh_failed");
    drawSettings();
  });
  box.querySelectorAll("[data-supdel]").forEach(b => b.onclick = () => {
    const id = b.dataset.supdel;
    if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = t("tap_again"); return; }
    commit("supplier", {sup: {...SUP[id], hidden: true}});
    DATA.suppliers = DATA.suppliers.filter(x => x.id !== id);
    drawSettings();
  });
  box.querySelectorAll("[data-pl]").forEach(b => b.onclick = () => gate("pl", () => {
    const f = $("#price-file"); f.value = ""; f.dataset.sid = b.dataset.pl; f.click();
    closeSettings();
  }));
  box.querySelector("#sync-now")?.addEventListener("click", () => { Sync.kick(); setTimeout(drawSettings, 800); });
  box.querySelector("#s-export")?.addEventListener("click", () => gate("hist", exportForComputer));
  box.querySelector("#s-clear")?.addEventListener("click", () => {
    if (!ST.confirmClear) { ST.confirmClear = true; return drawSettings(); }
    clearPhone();
  });
}

/* ------------------------------------------------------------------ start */
let appStarted = false;
function startFresh() {          // a shop that signed up itself: no practice numbers anywhere
  const today = todayISO();
  Object.assign(DATA, {date: today, lines: [], rates: {}, sim: null, sample_bill: null, cards: {},
                       stock: {count_date: today, counts: {}, lots: {}}});
  DATA.suppliers.length = 0;                 // the shop adds its own wholesalers
  for (const k of Object.keys(SUP)) delete SUP[k];
}
async function startApp() {
  $("#auth").hidden = true;
  $("#app").hidden = false;
  Auth.locked = false;
  if (!appStarted) {
    appStarted = true;
    if (!Auth.isExample()) startFresh();
    bindShop(Auth.shop.id);
    Sync.start();
    BillQueue.load();
    const sample = window.claude?.use ? await window.claude.use("sample") : null;
    if (sample) {
      S.sample = sample;
      const lim = await sample.limits().catch(() => null);
      S.imagesOK = !!lim?.images;
    }
    if (window.claude?.use) {
      S.assets = await window.claude.use("assets");
      S.downloads = await window.claude.use("downloads");
    }
  }
  if (L.details) { commit("shop_details", {details: L.details}); L.details = null; }
  handleConfirmLink();
  render();
}
$("#open-settings").onclick = openSettings;
bindPlanUI();
(async () => {
  applyAppearance();
  if (!window.crypto?.subtle && !Cloud) {
    $("#auth").hidden = false;
    $("#auth").innerHTML = `<p class="auth-foot">This page needs a secure (https) address to keep PINs safe.</p>`;
    return;
  }
  const state = await Auth.restore();
  if (state === "ok") return startApp();
  if (state === "shop") return pickShopStep();
  if (state === "unlock") return showLogin("unlock");
  showLogin(state);
})();
